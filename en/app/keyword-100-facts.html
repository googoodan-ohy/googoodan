<script>
(()=>{'use strict';const title='multiplication facts worksheets 100 problems',p=new URLSearchParams(location.search),seed0=Number(p.get('seed'))||20261008;let seed=seed0,mode='problem';
function questions(){const out=[],seen=new Set();for(let step=0;step<50&&out.length<100;step++)for(const q of GDTimes.rows((seed+step*10007)>>>0,120)){const key=q.a+':'+q.b;if(seen.has(key))continue;seen.add(key);out.push(q);if(out.length===100)break}if(out.length!==100)throw Error('The existing times-table generator did not provide 100 distinct problems');return out}
function page(items,pageNumber,answer){const paper=document.createElement('article');paper.className='paper '+(answer?'answer-page':'problem-page');paper.innerHTML='<div class="head"><div class="head-top"><span class="brand">googoodan.com</span><span class="title">'+title+'</span><span class="badge">'+(answer?'Answer key':'Worksheet')+'</span></div><div class="fields"><span>Name</span><span>Date</span><span>Time / Score</span></div></div><div class="instruction">Solve each multiplication fact. Each worksheet has 100 problems on two pages.</div><div class="grid"></div><div class="footer">googoodan.com · Build skills step by step <span class="page-number">'+pageNumber+' / 2</span></div>';const grid=paper.querySelector('.grid');for(let i=0;i<items.length;i++){const q=items[i],cell=document.createElement('div');cell.className='cell';cell.innerHTML='<span class="num">'+((pageNumber-1)*50+i+1)+'</span>'+q.a+' × '+q.b+' = <span class="'+(answer?'answer':'')+'">'+(answer?q.answer:'□')+'</span>';grid.append(cell)}return paper}
function render(){const q=questions(),root=document.getElementById('pages');root.replaceChildren(page(q.slice(0,50),1,false),page(q.slice(50),2,false),page(q.slice(0,50),1,true),page(q.slice(50),2,true));document.body.className='view-'+mode;for(const k of ['problem','answer','both'])document.getElementById(k).classList.toggle('active',mode===k)}
for(const k of ['problem','answer','both'])document.getElementById(k).onclick=()=>{mode=k;render()};document.getElementById('new').onclick=()=>{seed=(seed+10007)>>>0;p.set('seed',String(seed));history.replaceState(null,'','?'+p);render()};document.getElementById('print').onclick=()=>print();render();
})();
