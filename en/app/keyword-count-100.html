<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>counting worksheets 1-100 · googoodan.com</title><style>

<script src="/en/app/approved-worksheets/generators/grade-math.js"></script><script src="/en/app/approved-worksheets/generators/grade-extension.js"></script><script>
(()=>{'use strict';const title='counting worksheets 1-100',params=new URLSearchParams(location.search);let seed=Number(params.get('seed'))||20261008,mode='problem';function questions(){const out=[],seen=new Set();for(let offset=0;offset<2000&&out.length<24;offset++){const groups=GradeMath.generate(1,'count120',(seed+offset*10007)>>>0);for(const group of groups)for(const item of group.questions){const start=Number(item.prompt.match(/Start at (\d+)/)?.[1]);if(!Number.isInteger(start)||start<1||start+3>100||seen.has(start))continue;seen.add(start);out.push({start,answers:[start+2,start+3]});if(out.length===24)return out}}if(out.length!==24)throw Error('The existing counting generator did not provide 24 unique problems within 1-100');return out}function page(items,answer){const paper=document.createElement('article');paper.className='paper '+(answer?'answer-page':'problem-page');paper.innerHTML='<div class="head"><div class="head-top"><span class="brand">googoodan.com</span><span class="title">'+title+'</span><span class="badge">'+(answer?'Answer key':'Worksheet')+'</span></div><div class="fields"><span>Name</span><span>Date</span><span>Time / Score</span></div></div><div class="instruction">Count forward by ones. Write the two missing numbers.</div><div class="grid"></div><div class="footer">googoodan.com · Build skills step by step</div>';const grid=paper.querySelector('.grid');for(let i=0;i<items.length;i++){const q=items[i],cell=document.createElement('div');cell.className='cell';cell.innerHTML='<span class="num">'+(i+1)+'</span><span class="prompt">Count from '+q.start+'.</span><span class="sequence">'+q.start+' → '+(q.start+1)+' → <span class="write-box '+(answer?'answer':'')+'">'+(answer?q.answers[0]:'')+'</span> → <span class="write-box '+(answer?'answer':'')+'">'+(answer?q.answers[1]:'')+'</span></span>';grid.append(cell)}return paper}function render(){const q=questions(),root=document.getElementById('pages');root.replaceChildren(page(q,false),page(q,true));document.body.className='view-'+mode;for(const key of ['problem','answer','both'])document.getElementById(key).classList.toggle('active',mode===key)}for(const key of ['problem','answer','both'])document.getElementById(key).onclick=()=>{mode=key;render()};document.getElementById('new').onclick=()=>{seed=(seed+10007)>>>0;params.set('seed',String(seed));history.replaceState(null,'','?'+params);render()};document.getElementById('print').onclick=()=>print();render()})();
