<!doctype html><html lang="en-US"><head><meta charset="utf-8"><title>New English Guides — Local Review</title>
<link rel="stylesheet" href="/site-language-menu.css"><link rel="stylesheet" href="/en/gd-shell-us.css"><style>body{max-width:1120px;margin:24px auto;padding:0 24px;background:#f5f9f6;color:#214c50;font:16px/1.65 Arial,sans-serif}header{border-bottom:1px solid #cbded5;padding-bottom:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#f5f9f6;padding:12px 0;z-index:2}input,select,button{font:inherit;padding:8px;border:1px solid #abcbbd;border-radius:5px;background:white;color:#214c50}select{max-width:100%;flex:1;min-width:250px}button{cursor:pointer}#worksheet{width:100%;height:1160px;border:0}#status{font-size:14px}@media print{header,.controls,#status,#worksheet{display:none}}</style>
<script defer src="/en/gd-shell-us.js"></script><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://googoodan.com/en/app/english-guide-review.html"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><body data-guide-review="true"><header><h1>New English Guides — Local Review</h1><p>Newly written English adaptations use the existing eight-section format. Review the worksheet and its guide together.</p><a href="/">Back to worksheets</a></header><div class="controls"><input id="search" type="search" placeholder="Search title or worksheet ID"><select id="select" aria-label="Select an English guide"></select><button id="prev">Previous</button><button id="next">Next</button></div><p id="status"></p><iframe id="worksheet" title="Worksheet and answer key"></iframe><article id="guide"></article>
<script src="english-guide-panel.js?v=english-guides-1"></script><script>
(async()=>{const api=window.EnglishWorksheetGuides,all=await api.data(),variants=await fetch('keyword-variants.json').then(r=>r.json());const byId=new Map(variants.map(v=>[String(v.id),v]));const approved=new Set((await fetch('approved-worksheets/worksheet-data.json').then(r=>r.json())).resources.map(r=>r.id));const allEntries=Object.entries(all).filter(([,g])=>g.reviewStatus==='pending');let entries=allEntries;const select=document.getElementById('select');
function url(key){const [kind,id]=key.split(':');if(kind==='type')return 'training-player/type.html?type='+id;if(kind==='resource')return (approved.has(id)?'approved-worksheets/':'candidate-worksheets/review-48.html')+'?id='+id+'&embedded=1';if(kind==='times')return 'times-resources/ko/times-tables/player.html?tables=2';const v=byId.get(id);if(v.kind==='training')return 'training-player/type.html?type=kw74-'+id;if(v.kind==='approved')return 'approved-worksheets/?id='+v.source+'&embedded=1&keywordVariant='+id;if(v.kind==='times')return 'times-resources/ko/times-tables/player.html?tables='+encodeURIComponent(v.source)+'&keywordVariant='+id;return v.source;}
function show(){const key=select.value;if(!key)return;api.render(all[key],document.getElementById('guide'));document.getElementById('worksheet').src=url(key);document.getElementById('status').textContent=(select.selectedIndex+1)+' of '+entries.length+' filtered guides · '+allEntries.length+' new English guides in total · '+key;history.replaceState(null,'','?guide='+encodeURIComponent(key));}
function fill(preferred){select.replaceChildren();entries.forEach(([key,g])=>{const option=document.createElement('option');option.value=key;option.textContent=key+' · '+g.title;select.append(option);});if(preferred&&entries.some(([key])=>key===preferred))select.value=preferred;show();}
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();entries=allEntries.filter(([key,g])=>(key+' '+g.title+' '+g.overview).toLowerCase().includes(q));fill();};select.onchange=show;document.getElementById('prev').onclick=()=>{select.selectedIndex=Math.max(0,select.selectedIndex-1);show();};document.getElementById('next').onclick=()=>{select.selectedIndex=Math.min(entries.length-1,select.selectedIndex+1);show();};fill(new URLSearchParams(location.search).get('guide'));})().catch(console.error);
</script><script defer src="/site-language-menu.js"></script></body></html>
