iv class="hero"><h1>8の段の九九プリント</h1></div><iframe id="worksheet-player" scrolling="no" title="九九" src="/ja/kuku/player.html?type=times-tables&amp;tables=8"></iframe><section class="static-guide"><h2>この段のしくみ</h2><p>同じ数を3回2倍すると8倍になります。2倍、4倍、8倍の順に進めると、答えを確かめやすくなります。</p><h2>計算の例</h2><p>8 × 7 = 56。10 × 7 の70から、7を2つ分の14を引いても56です。</p><h2>まちがえやすい点</h2><p>10の段から確かめるときは、1つ分でなく2つ分を引きます。</p></section></div></main></div><footer><span>googoodan.com · 無料の算数プリント</span><a href="/ja/help.html">ご利用案内</a></footer><script defer src="/site-language-menu.js"></script></body></html>
