<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>운영자 통계 설정 · googoodan.</title><style>body{max-width:600px;margin:60px auto;padding:24px;font:17px/1.8 sans-serif;color:#193f50}button{padding:14px;border:0;border-radius:8px;background:#187564;color:white;font:inherit;margin:8px}a{color:#187564}</style><link rel="stylesheet" href="/ad-visibility.css?v=20260910-hide"></head><body><h1>운영자 통계 설정</h1><p>이 브라우저의 접속을 방문자 카운터와 Google Analytics 집계에서 제외합니다. 다른 브라우저나 기기에서는 각각 설정해 주세요. 브라우저 저장 데이터를 지우면 다시 설정해야 합니다.</p><p id="status"></p><button id="exclude">이 브라우저 집계 제외</button><button id="include">집계 다시 포함</button><p><a href="/">메인으로 돌아가기</a></p><script>function show(){try{document.getElementById('status').textContent=localStorage.getItem('gd_operator_excluded')==='1'?'현재 상태: 집계 제외 중':'현재 상태: 집계에 포함됨'}catch{document.getElementById('status').textContent='브라우저 저장소를 사용할 수 없습니다.'}}document.getElementById('exclude').onclick=()=>{try{localStorage.setItem('gd_operator_excluded','1');show()}catch{show()}};document.getElementById('include').onclick=()=>{try{localStorage.removeItem('gd_operator_excluded');show()}catch{show()}};show();</script></body></html>
