<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & visual glyphs
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function polygonSVG(sides, size, opts={}){
  const cx=size/2, cy=size/2, r=size/2-8;
  const stroke = opts.stroke || COLOR.ink;
  const fill = opts.fill || '#fff';
  const pts=[];
  for(let i=0;i<sides;i++){
    const a=(-90 + i*360/sides)*Math.PI/180;
    pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
  }
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  s += `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
  if(opts.dots){
    pts.forEach(p=>{ s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.2" fill="${stroke}"/>`; });
  }
  s += `</svg>`;
  return s;
}
function circleSVG(size, opts={}){
  const stroke = opts.stroke || COLOR.ink;
  const fill = opts.fill || '#fff';
  const r = size/2-8;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3"/></svg>`;
}
function shapeIconSVG(name, size, opts={}){
  if(name==='원') return circleSVG(size, opts);
  const s = SHAPE_ALL.find(x=>x.name===name);
  return polygonSVG(s.sides, size, opts);
}
function hasCarryAdd(a,b){
  const ad=[Math.floor(a/100)%10, Math.floor(a/10)%10, a%10];
  const bd=[Math.floor(b/100)%10, Math.floor(b/10)%10, b%10];
  return (ad[1]+bd[1]>=10) || (ad[2]+bd[2]>=10) || (ad[0]+bd[0]>=10);
}
function hasBorrowSub(a,b){
  const ad=[Math.floor(a/100)%10, Math.floor(a/10)%10, a%10];
  const bd=[Math.floor(b/100)%10, Math.floor(b/10)%10, b%10];
  return (ad[1]<bd[1]) || (ad[2]<bd[2]);
}

// ---- Base-ten "100" block picture (백 모형) ----
function hundredBlockSVG(x,y,cell,color){
  const size = cell*10;
  let s = `<rect x="${x}" y="${y}" width="${size}" height="${size}" fill="${color}" stroke="${COLOR.ink}" stroke-width="1"/>`;
  for(let i=1;i<10;i++){
    s += `<line x1="${x+i*cell}" y1="${y}" x2="${x+i*cell}" y2="${y+size}" stroke="#fff" stroke-width="0.6"/>`;
    s += `<line x1="${x}" y1="${y+i*cell}" x2="${x+size}" y2="${y+i*cell}" stroke="#fff" stroke-width="0.6"/>`;
  }
  return s;
}
function baseTenHundredsSVG(h, opts={}){
  const cell = opts.cell || 5;
  const perRow = opts.perRow || 3;
  const color = opts.color || COLOR.blue;
  const gap = 4;
  const block = cell*10;
  const cols = Math.min(perRow, Math.max(h,1));
  const rows = Math.ceil(h/perRow);
  const w = cols*block + (cols-1)*gap;
  const hgt = rows*block + (rows-1)*gap;
  let s = '';
  for(let i=0;i<h;i++){
    const r = Math.floor(i/perRow), c = i%perRow;
    s += hundredBlockSVG(c*(block+gap), r*(block+gap), cell, color);
  }
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}">${s}</svg>`;
}

// ---- Place-value tiles (백의 자리 / 십의 자리 / 일의 자리 카드) ----
function placeValueTilesHTML(h,t,o, highlightIdx){
  const labels = ['백의 자리','십의 자리','일의 자리'];
  const digits = [h,t,o];
  const colors = [COLOR.coral, COLOR.sun, COLOR.blue];
  const cells = digits.map((d,i)=>{
    const hl = i===highlightIdx;
    const style = hl ? `background:${colors[i]};color:#fff;border:2px solid ${colors[i]};` : `background:#f3f5fa;color:#1f2430;border:2px solid #d7deed;`;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div style="${style}width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17pt;font-weight:800;">${d}</div>
      <div style="font-size:7.6pt;color:#6b7386;font-weight:${hl?800:600};">${labels[i]}</div>
    </div>`;
  }).join('<div style="width:5px;"></div>');
  return `<div style="display:flex;justify-content:center;align-items:flex-start;gap:2px;">${cells}</div>`;
}

// ---- Number line for 뛰어세기 (always mode-invariant: blanks stay "?") ----
function numberLineSVG(seq, step, w){
  const width = w || 420, height = 66;
  const padX = 30, n = 5;
  const stepX = (width - padX*2) / (n-1);
  let s = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
  s += `<line x1="${padX-10}" y1="38" x2="${width-padX+10}" y2="38" stroke="${COLOR.ink}" stroke-width="2"/>`;
  for(let i=0;i<n;i++){
    const x = padX + i*stepX;
    const known = i < 3;
    s += `<line x1="${x}" y1="28" x2="${x}" y2="48" stroke="${COLOR.ink}" stroke-width="2"/>`;
    s += `<circle cx="${x}" cy="38" r="5" fill="${known?COLOR.mint:'#fff'}" stroke="${COLOR.ink}" stroke-width="2"/>`;
    s += `<text x="${x}" y="20" font-size="12" text-anchor="middle" font-weight="800" fill="${known?COLOR.ink:'#c7cbd6'}">${known? seq[i] : '?'}</text>`;
    if(i<n-1) s += `<text x="${x+stepX/2}" y="62" font-size="9.5" text-anchor="middle" fill="#8a91a3" font-weight="700">+${step}</text>`;
  }
  s += `</svg>`;
  return s;
}

// ---- Bar chart for size comparison ----
function barCompareSVG(values, opts={}){
  const w = opts.w || 190, barH = 24, gap = 10, maxV = 999, maxBarW = w - 90;
  const colors = [COLOR.coral, COLOR.blue, COLOR.violet];
  const h = values.length*(barH+gap);
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  values.forEach((v,i)=>{
    const bw = Math.max(18, v/maxV*maxBarW);
    const y = i*(barH+gap);
    s += `<rect x="60" y="${y}" width="${bw}" height="${barH}" rx="5" fill="${colors[i%colors.length]}"/>`;
    s += `<text x="52" y="${y+barH/2+4}" font-size="11.5" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${v}</text>`;
  });
  s += `</svg>`;
  return s;
}

// ---- Length ruler bar ----
function lengthBarSVG(cm, opts={}){
  const maxCm = opts.maxCm || 100;
  const w = opts.w || 170, barH = 20;
  const scale = Math.min(1, cm/maxCm);
  const bw = Math.max(22, scale*(w-24));
  const color = opts.color || COLOR.blue;
  let s = `<svg width="${w}" height="${barH+16}" viewBox="0 0 ${w} ${barH+16}">`;
  s += `<rect x="1" y="1" width="${bw}" height="${barH}" rx="4" fill="${color}"/>`;
  const ticks = Math.floor(cm/10);
  for(let i=1;i<=ticks;i++){
    const x = 1 + (i*10/maxCm)*(w-24);
    if(x < bw) s += `<line x1="${x}" y1="1" x2="${x}" y2="${1+barH}" stroke="#fff" stroke-width="1" opacity=".6"/>`;
  }
  s += `<text x="1" y="${barH+14}" font-size="10" font-weight="800" fill="${COLOR.ink}">${cm} cm</text>`;
  s += `</svg>`;
  return s;
}

// ---- Grouped icons (묶음 상자) for 곱셈 ----
function groupedIconsHTML(groups, per, glyph){
  const boxes = [];
  for(let g=0; g<groups; g++){
    const items = new Array(per).fill(`<span style="font-size:12.5pt;">${glyph}</span>`).join('');
    boxes.push(`<span style="display:inline-flex;flex-wrap:wrap;max-width:${Math.max(56,per*16)}px;border:2px dashed #c7cbd6;border-radius:8px;padding:3px 4px;gap:1px;vertical-align:middle;">${items}</span>`);
  }
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;">${boxes.join('')}</div>`;
}

// ---- Pictograph rows for 분류하기 ----
function pictographHTML(set, counts){
  return set.cats.map((c,i)=>{
    const icons = new Array(counts[i]).fill(`<span style="font-size:12.5pt;">${set.glyphs[i]}</span>`).join(' ');
    return `<div style="display:flex;align-items:center;gap:8px;margin:2px 0;">
      <span style="font-size:9pt;font-weight:700;color:#4a5268;min-width:64px;">${c}</span>
      <span>${icons}</span>
    </div>`;
  }).join('');
}
function classifySoupHTML(set){
  const pool = [];
  set.cats.forEach((c,i)=>{ for(let k=0;k<2;k++) pool.push(set.glyphs[i]); });
  return `<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:170px;margin:0 auto;">${pool.map(g=>`<span style="font-size:13pt;">${g}</span>`).join('')}</div>`;
}

function buildU4T5(rng, mode){

  const m1=randInt(rng,1,4), cm1=randInt(rng,0,99);
  const m2=randInt(rng,1,4), cm2=randInt(rng,0,99);
  if(isAdd){
    let totalCm = cm1+cm2;
    const extraM = Math.floor(totalCm/100);
    totalCm %= 100;
    const m = m1+m2+extraM;
    return `<div class="qline">📏 ${m1} m ${cm1} cm + ${m2} m ${cm2} cm =${ansSpan(mode, `${m} m ${totalCm} cm`)}</div>`;
  }else{
    let A=m1*100+cm1, B=m2*100+cm2;
    if(A<B){ const tmp=A; A=B; B=tmp; }
    if(A===B) A+=37;
    const diff=A-B;
    const dm=Math.floor(diff/100), dcm=diff%100;
    const am=Math.floor(A/100), acm=A%100, bm=Math.floor(B/100), bcm=B%100;
    return `<div class="qline">📏 ${am} m ${acm} cm - ${bm} m ${bcm} cm =${ansSpan(mode, `${dm} m ${dcm} cm`)}</div>`;
  }
}

      { name:'cm 단위 길이 비교', layout:'list', cols:1, rows:6, build:buildU4T1 },
      { name:'cm 단위 길이의 합', layout:'grid', cols:3, rows:5, build:buildU4T2 },
      { name:'cm 단위 길이의 차', layout:'grid', cols:3, rows:5, build:buildU4T3 },
      { name:'m와 cm의 관계', layout:'grid', cols:3, rows:5, build:buildU4T4 },
      { name:'m 단위 길이의 합과 차', layout:'list', cols:1, rows:6, build:buildU4T5 },
    ]},
  { key:'u5', num:'5', title:'분류하기', color:'var(--violet)',
    types:[
      { name:'분류 기준으로 알맞은 것 찾기', layout:'grid', cols:3, rows:4, build:buildU5T1 },
      { name:'분류하여 가장 많은 것 찾기', layout:'list', cols:1, rows:5, build:buildU5T2 },
      { name:'분류하고 전체 개수 세기', layout:'list', cols:1, rows:5, build:buildU5T3 },
    ]},
  { key:'u6', num:'6', title:'곱셈', color:'var(--teal)',
    types:[
      { name:'묶어 세기', layout:'list', cols:1, rows:8, build:buildU6T1 },
      { name:'몇의 몇 배', layout:'list', cols:1, rows:8, build:buildU6T2 },
      { name:'곱셈식으로 나타내기(문장제)', layout:'list', cols:1, rows:6, build:buildU6T3 },
      { name:'곱셈식 완성하기', layout:'list', cols:1, rows:8, build:buildU6T4 },
    ]},
];


const UNIT = UNITS[2];
const TYPE = UNIT.types[1];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 2학년 1학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
</script>
