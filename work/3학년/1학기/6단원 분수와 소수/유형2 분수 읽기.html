<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6단원 분수와 소수 - 유형2 분수 읽기</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
  }
  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;
    overflow-x:auto;
  }
  .preview-shadow{
    box-shadow:0 6px 24px rgba(20,30,60,.18);
  }

  /* ---------------- A4 Sheet ---------------- */
  .sheet{
    width:var(--page-w);
    height:var(--page-h);
    min-width:var(--page-w);
    min-height:var(--page-h);
    background:#fff;
    padding:var(--margin-y) var(--margin-x);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    flex:0 0 auto;
  }
  body.exporting .preview-shadow{ box-shadow:none; }

  .sheet .sh-header{ flex:0 0 auto; }

  .sh-cafe-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .sh-cafe-strip .cafe-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;
  }
  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;
    font-weight:600;
  }
  .sheet .sh-meta{
    display:flex;
    gap:16px;
    font-size:10.5pt;
    color:#374057;
  }
  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{
    display:flex;
    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:18px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }
  .fig-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  .vcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:13pt;
    display:inline-flex;
    flex-direction:column;
    align-items:flex-end;
    line-height:1.5;
  }
  .vcalc .vrow{ display:flex; gap:5px; }
  .vcalc .vrow .vop{ width:14px; font-weight:800; text-align:center; }
  .vcalc .vrow .vnum{ font-weight:700; white-space:pre; }
  .vcalc .vline{ border-top:2.5px solid var(--ink); align-self:stretch; margin:2px 0 3px; }

  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    font-weight:800;
    line-height:1.15;
    vertical-align:middle;
    font-size:11.5pt;
  }
  .frac .fbar{ border-top:2px solid currentColor; width:100%; min-width:16px; margin:1px 0; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>
</head>
<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & visual glyphs
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };
const POINT_LABELS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ'];
const SINO_KOR = [null,'일','이','삼','사','오','육','칠','팔','구','십','십일','십이'];
const CONTEXT_ITEMS = [
  { name:'색연필', counter:'자루' },
  { name:'구슬', counter:'개' },
  { name:'공책', counter:'권' },
  { name:'사탕', counter:'개' },
  { name:'색종이', counter:'장' },
  { name:'붙임딱지', counter:'장' },
  { name:'귤', counter:'개' },
  { name:'풍선', counter:'개' },
];

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
// All helpers below build with flexbox rather than CSS grid, since CSS grid
// can render unreliably through the html2canvas PDF/preview export path.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}

// ---- Vertical column calculation (세로셈): 100%-mode-invariant shell, only
// the final answer row's text is ever wrapped in ansSpan (empty in problem
// mode, so nothing is rendered there — no blank box is drawn). ----
function vcalcHTML(aVal, opSym, bVal, ansVal, mode){
  const aStr = String(aVal), bStr = String(bVal), ansStr = String(ansVal);
  const w = Math.max(aStr.length, bStr.length, ansStr.length);
  const pad = s => s.padStart(w, ' ');
  return `<div class="vcalc">
    <div class="vrow"><span class="vop"></span><span class="vnum">${pad(aStr)}</span></div>
    <div class="vrow"><span class="vop">${opSym}</span><span class="vnum">${pad(bStr)}</span></div>
    <div class="vline"></div>
    <div class="vrow"><span class="vop"></span><span class="vnum">${ansSpan(mode, pad(ansStr))}</span></div>
  </div>`;
}

// ---- Grouped icons (묶음 상자) for 나눗셈/곱셈 ----
function groupedIconsHTML(groups, per, glyph){
  const boxes = [];
  for(let g=0; g<groups; g++){
    const items = new Array(per).fill(`<span style="font-size:12.5pt;">${glyph}</span>`).join('');
    boxes.push(`<span style="display:inline-flex;flex-wrap:wrap;max-width:${Math.max(56,per*16)}px;border:2px dashed #c7cbd6;border-radius:8px;padding:3px 4px;gap:1px;vertical-align:middle;">${items}</span>`);
  }
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;">${boxes.join('')}</div>`;
}

// ---- 선분 / 반직선 / 직선 figure (points 항상 고정 위치, 라벨/종류만 랜덤) ----
function lineFigureSVG(kind, labelA, labelB, w){
  w = w || 170;
  const h = 56, midY = 30, xA = 32, xEnd = w - 16;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  if(kind === 'segment'){
    const xB = xEnd - 10;
    s += `<line x1="${xA}" y1="${midY}" x2="${xB}" y2="${midY}" stroke="${COLOR.ink}" stroke-width="2.4"/>`;
    s += `<circle cx="${xA}" cy="${midY}" r="3.4" fill="${COLOR.ink}"/>`;
    s += `<circle cx="${xB}" cy="${midY}" r="3.4" fill="${COLOR.ink}"/>`;
    s += `<text x="${xA}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelA}</text>`;
    s += `<text x="${xB}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelB}</text>`;
  } else if(kind === 'ray'){
    const xB = xA + (xEnd-xA)*0.55;
    s += `<line x1="${xA}" y1="${midY}" x2="${xEnd}" y2="${midY}" stroke="${COLOR.ink}" stroke-width="2.4"/>`;
    s += `<polygon points="${xEnd},${midY} ${xEnd-9},${midY-5} ${xEnd-9},${midY+5}" fill="${COLOR.ink}"/>`;
    s += `<circle cx="${xA}" cy="${midY}" r="3.4" fill="${COLOR.ink}"/>`;
    s += `<text x="${xA}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelA}</text>`;
    s += `<text x="${xB}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelB}</text>`;
  } else { // 'line'
    const xB = xA + (xEnd-xA)*0.62;
    s += `<line x1="${xA}" y1="${midY}" x2="${xEnd}" y2="${midY}" stroke="${COLOR.ink}" stroke-width="2.4"/>`;
    s += `<polygon points="${xEnd},${midY} ${xEnd-9},${midY-5} ${xEnd-9},${midY+5}" fill="${COLOR.ink}"/>`;
    s += `<polygon points="${xA},${midY} ${xA+9},${midY-5} ${xA+9},${midY+5}" fill="${COLOR.ink}"/>`;
    s += `<text x="${xA+18}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelA}</text>`;
    s += `<text x="${xB}" y="${midY-10}" font-size="13" font-weight="800" text-anchor="middle" fill="${COLOR.ink}">${labelB}</text>`;
  }
  s += `</svg>`;
  return s;
}

// ---- 각 figure: 꼭짓점에서 두 반직선이 이루는 각 (deg는 항상 고정 표시,
// 직각인지 여부를 나타내는 별도 마크는 그리지 않음 — 학생이 눈으로 판단) ----
function angleFigureSVG(deg, size){
  size = size || 70;
  const cx = 20, cy = size - 6, len = size - 16;
  const rad2 = deg * Math.PI / 180;
  const x1 = cx + len, y1 = cy;
  const x2 = cx + len*Math.cos(rad2), y2 = cy - len*Math.sin(rad2);
  const w = Math.max(x1, x2) + 14;
  let s = `<svg width="${w.toFixed(0)}" height="${size}" viewBox="0 0 ${w.toFixed(0)} ${size}">`;
  s += `<line x1="${cx}" y1="${cy}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="${COLOR.ink}" stroke-width="2.4"/>`;
  s += `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${COLOR.ink}" stroke-width="2.4"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="2.6" fill="${COLOR.ink}"/>`;
  s += `</svg>`;
  return s;
}

// ---- 삼각형 figure: isRight일 때 좌하단 꼭짓점이 정확히 90도가 되도록
// 좌표를 고정 구성 ----
function triangleSVG(isRight, w){
  w = w || 110;
  const h = 80;
  let x1,y1,x2,y2,x3,y3;
  if(isRight){
    x1=14; y1=h-10; x2=w-14; y2=h-10; x3=14; y3=14;
  } else {
    x1=14; y1=h-10; x2=w-14; y2=h-14; x3=w*0.42; y3=12;
  }
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s += `<polygon points="${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="none" stroke="${COLOR.ink}" stroke-width="2.2"/>`;
  s += `</svg>`;
  return s;
}

// ---- 직사각형/정사각형 변 길이 figure. labels = {top,right,bottom,left},
// 값이 없는 방향은 표시하지 않고, '?' 문자열은 항상 리터럴 물음표로 고정 ----
function rectSideSVG(boxW, boxH, labels){
  const pad = 18;
  const w = boxW + pad*2, h = boxH + pad*2;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s += `<rect x="${pad}" y="${pad}" width="${boxW}" height="${boxH}" fill="none" stroke="${COLOR.ink}" stroke-width="2.2"/>`;
  if(labels.top)    s += `<text x="${pad+boxW/2}" y="${pad-6}" font-size="11" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${labels.top}</text>`;
  if(labels.bottom) s += `<text x="${pad+boxW/2}" y="${pad+boxH+14}" font-size="11" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${labels.bottom}</text>`;
  if(labels.left)   s += `<text x="${pad-6}" y="${pad+boxH/2+4}" font-size="11" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${labels.left}</text>`;
  if(labels.right)  s += `<text x="${pad+boxW+8}" y="${pad+boxH/2+4}" font-size="11" text-anchor="start" font-weight="800" fill="${COLOR.ink}">${labels.right}</text>`;
  s += `</svg>`;
  return s;
}

// ---- 분수를 세로 표기로 (분자/분모, 가운데 가로선) ----
function fracHTML(num, den){
  return `<span class="frac">${num}<span class="fbar"></span>${den}</span>`;
}

// ---- 전체를 total칸으로 나눈 막대에서 shaded칸을 색칠 (분수/소수 공용) ----
function fracBarSVG(total, shaded, color, w){
  w = w || Math.min(190, total*24);
  const segW = w/total, h = 32;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<total;i++){
    const x = i*segW;
    const fill = i < shaded ? color : '#ffffff';
    s += `<rect x="${x.toFixed(1)}" y="2" width="${(segW-1.5).toFixed(1)}" height="${h-6}" fill="${fill}" stroke="${COLOR.ink}" stroke-width="1.4"/>`;
  }
  s += `</svg>`;
  return s;
}

function buildU2T2(rng, mode){ // 직각 판별하기

  else { do{ deg = randInt(rng,2,35)*5; } while(deg>=85 && deg<=95); } // widen the non-right pool to ~30 values so repeats within one sheet stay rare
  const ans = isRight ? '직각' : '직각 아님';
  return `<div class="fig-wrap">${angleFigureSVG(deg)}</div>
    <div class="qline">이 각이 직각이면 "직각", 아니면 "직각 아님"이라고 쓰세요.${ansSpan(mode, ans)}</div>`;

const TYPE = UNIT.types[1];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 3학년 1학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
</script>
