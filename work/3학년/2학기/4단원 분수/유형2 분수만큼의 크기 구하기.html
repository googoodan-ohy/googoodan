<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4단원 분수 - 유형2 분수만큼의 크기 구하기</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
  }
  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;
    overflow-x:auto;
  }
  .preview-shadow{
    box-shadow:0 6px 24px rgba(20,30,60,.18);
  }

  /* ---------------- A4 Sheet ---------------- */
  .sheet{
    width:var(--page-w);
    height:var(--page-h);
    min-width:var(--page-w);
    min-height:var(--page-h);
    background:#fff;
    padding:var(--margin-y) var(--margin-x);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    flex:0 0 auto;
  }
  body.exporting .preview-shadow{ box-shadow:none; }

  .sheet .sh-header{ flex:0 0 auto; }

  .sh-cafe-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .sh-cafe-strip .cafe-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;
  }
  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;
    font-weight:600;
  }
  .sheet .sh-meta{
    display:flex;
    gap:16px;
    font-size:10.5pt;
    color:#374057;
  }
  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{
    display:flex;
    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:18px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }
  .fig-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>
</head>
<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & visual glyphs
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };

const DIV_ITEMS = [
  { name:'사탕', emoji:'🍬' }, { name:'구슬', emoji:'🔵' }, { name:'귤', emoji:'🍊' }, { name:'연필', emoji:'✏️' },
];
const MUL_UNITS = [
  { unit:'개', label:'상자', verb:'들어 있습니다' },
  { unit:'장', label:'묶음', verb:'꽂혀 있습니다' },
  { unit:'명', label:'모둠', verb:'앉아 있습니다' },
];
const CAP_ITEMS = [
  { name:'물병', emoji:'🍶' }, { name:'주전자', emoji:'🫖' }, { name:'양동이', emoji:'🪣' }, { name:'어항', emoji:'🐠' },
];
const CIRCLE_TERMS = [
  { q:'원 위의 두 점을 이어서 그린 선분 중 원의 중심을 지나는 선분을 무엇이라고 하나요?', a:'지름' },
  { q:'원을 두 부분으로 똑같이 나누는 가장 긴 선분을 무엇이라고 하나요?', a:'지름' },
  { q:'원의 중심과 원 위의 한 점을 이은 선분을 무엇이라고 하나요?', a:'반지름' },
  { q:'원의 중심에서 원 위의 한 점까지의 거리를 무엇이라고 하나요?', a:'반지름' },
  { q:'원 안에서 가장 가운데에 있는 점을 무엇이라고 하나요?', a:'원의 중심' },
  { q:'컴퍼스로 원을 그릴 때 바늘이 꽂히는 점을 무엇이라고 하나요?', a:'원의 중심' },
];
const DATA_SETS3 = [
  { itemsLabel:'학생', countUnit:'명', attrName:'마을별 학생 수', cats:['해마을','달마을','별마을','솔마을'] },
  { itemsLabel:'학생', countUnit:'명', attrName:'좋아하는 운동별 학생 수', cats:['축구','야구','농구','줄넘기'] },
  { itemsLabel:'가구', countUnit:'가구', attrName:'키우는 반려동물별 가구 수', cats:['강아지','고양이','물고기'] },
];
const GLYPH_BIG = '◆', GLYPH_SMALL = '•';

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
// All helpers below build with flexbox rather than CSS grid, since CSS grid
// can render unreliably through the html2canvas PDF/preview export path.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function divCalc(aStr, bStr, ansText, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">÷</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, ansText)}`;
}

// ---- Vertical multiplication (세로셈): wrapper is identical in both modes,
// only the last row's ansSpan-wrapped text differs. ----
function vmulHTML(topStr, bottomStr, ansStr, mode){
  return `<div style="display:inline-flex;flex-direction:column;align-items:flex-end;font-family:'Consolas','SF Mono','Roboto Mono',monospace;font-size:13pt;font-weight:700;line-height:1.55;">
    <div>${topStr}</div>
    <div>× ${bottomStr}</div>
    <div style="width:100%;border-top:2px solid ${COLOR.ink};margin:2px 0;"></div>
    <div style="min-height:1.3em;">${ansSpan(mode, ansStr)}</div>
  </div>`;
}

// ---- Flat pool of icons (나눗셈을 그림으로 이해하기) ----
function poolIconsHTML(total, emoji, maxW){
  const w = maxW || 240;
  const items = new Array(total).fill(`<span style="font-size:12pt;">${emoji}</span>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:${w}px;margin:0 auto;">${items}</div>`;
}

// ---- Circle diagram: center/radius/diameter. Unknown labels always render
// as the literal "?" placeholder, never the hidden numeric value. ----
function circleDiagramSVG(pxR, opts={}){
  const pad = 20 + (opts.diameterLine ? 24 : 0);
  const size = pxR*2 + pad*2;
  const cx = size/2, cy = pxR + pad;
  const color = opts.color || COLOR.blue;
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${pxR}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  if(opts.showCenter) s += `<circle cx="${cx}" cy="${cy}" r="3" fill="${COLOR.ink}"/>`;
  if(opts.radiusLine){
    s += `<line x1="${cx}" y1="${cy}" x2="${cx+pxR}" y2="${cy}" stroke="${COLOR.ink}" stroke-width="2"/>`;
    if(opts.radiusLabel!=null) s += `<text x="${cx+pxR/2}" y="${cy-8}" font-size="11" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${opts.radiusLabel}</text>`;
  }
  if(opts.diameterLine){
    const dy = cy+pxR+16;
    s += `<line x1="${cx-pxR}" y1="${dy}" x2="${cx+pxR}" y2="${dy}" stroke="${color}" stroke-width="2"/>`;
    if(opts.diameterLabel!=null) s += `<text x="${cx}" y="${dy+14}" font-size="11" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${opts.diameterLabel}</text>`;
  }
  s += `</svg>`;
  return s;
}

// ---- Inline stacked fraction (numerator over denominator). Used only for
// GIVEN fractions in the qline text, never inside ansSpan (keeps the mode-
// sync signature regex, which strips only <span class="ans">, simple). ----
function fracInline(num, den){
  return `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;">
    <span style="font-size:11pt;font-weight:800;">${num}</span>
    <span style="width:100%;border-top:2px solid ${COLOR.ink};"></span>
    <span style="font-size:11pt;font-weight:800;">${den}</span>
  </span>`;
}

// ---- Shaded fraction bar (부분/전체) ----
function fractionBarSVG(total, shaded, opts={}){
  const w = opts.w || 170, h = 26, segW = w/total;
  const color = opts.color || COLOR.violet;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<total;i++){
    const x = i*segW;
    const fill = i<shaded ? color : '#fff';
    s += `<rect x="${x.toFixed(1)}" y="1" width="${(segW-1.5).toFixed(1)}" height="${h-2}" fill="${fill}" stroke="${COLOR.ink}" stroke-width="1.4"/>`;
  }
  s += `</svg>`;
  return s;
}

// ---- Grouped set for 분수만큼의 크기: num of the den boxes are highlighted
// (num/den are always givens, so this never previews the hidden answer). ----
function fractionOfSetHTML(perGroup, groups, num, glyph){
  const boxes = [];
  for(let g=0; g<groups; g++){
    const hl = g<num;
    const items = new Array(perGroup).fill(`<span style="font-size:11pt;">${glyph}</span>`).join('');
    boxes.push(`<span style="display:inline-flex;flex-wrap:wrap;max-width:${Math.max(50,perGroup*15)}px;border:2px ${hl?'solid':'dashed'} ${hl?COLOR.violet:'#c7cbd6'};background:${hl?'#f2ecfc':'transparent'};border-radius:8px;padding:3px 4px;gap:1px;">${items}</span>`);
  }
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;">${boxes.join('')}</div>`;
}

// ---- Capacity/weight amount bar (들이·무게 단위) ----
function amountBarSVG(value, opts={}){
  const maxVal = opts.maxVal || 1000;
  const w = opts.w || 170, barH = 20;
  const scale = Math.min(1, value/maxVal);
  const bw = Math.max(22, scale*(w-24));
  const color = opts.color || COLOR.mint;
  let s = `<svg width="${w}" height="${barH+16}" viewBox="0 0 ${w} ${barH+16}">`;
  s += `<rect x="1" y="1" width="${bw}" height="${barH}" rx="4" fill="${color}"/>`;
  s += `<text x="1" y="${barH+14}" font-size="10" font-weight="800" fill="${COLOR.ink}">${value}${opts.unit||''}</text>`;
  s += `</svg>`;
  return s;
}

// ---- Small flex table with a "?" total column (표에서 합계 구하기) ----
function sumTableHTML(cats, counts){
  const cellW = 56, cellH = 30;
  const cellStyle = `width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;font-size:9.5pt;`;
  const headerCells = cats.map(c=>`<div style="${cellStyle}background:#f3f5fa;font-weight:800;">${c}</div>`).join('')
    + `<div style="${cellStyle}background:#f3f5fa;font-weight:800;">합계</div>`;
  const countCells = counts.map(v=>`<div style="${cellStyle}font-weight:700;">${v}</div>`).join('')
    + `<div style="${cellStyle}font-weight:800;background:${COLOR.teal};color:#fff;">?</div>`;
  return `<div style="display:inline-block;border:1.5px solid #d7deed;padding:2px;">
    <div style="display:flex;gap:1px;">${headerCells}</div>
    <div style="display:flex;gap:1px;margin-top:1px;">${countCells}</div>
  </div>`;
}

// ---- Pictogram table: 5-unit big glyph + 1-unit small glyph together ----
function pictogramTableHTML(cats, counts){
  const rows = cats.map((c,i)=>{
    const cnt = counts[i];
    const big = Math.floor(cnt/5), small = cnt%5;
    const icons = `<span style="font-size:13pt;color:${COLOR.teal};">${GLYPH_BIG.repeat(big)}</span>` +
      (small>0 ? `<span style="font-size:11pt;color:${COLOR.teal};margin-left:2px;">${GLYPH_SMALL.repeat(small)}</span>` : '');
    return `<div style="display:flex;align-items:center;gap:8px;">
      <div style="width:52px;font-size:9pt;font-weight:800;color:#374057;flex:0 0 auto;">${c}</div>
      <div style="display:flex;flex-wrap:wrap;gap:1px;align-items:center;max-width:300px;">${icons}</div>
    </div>`;
  }).join('<div style="height:4px;"></div>');
  const legend = `<div style="display:flex;gap:14px;font-size:8pt;color:#6b7386;margin-top:6px;">
    <span style="color:${COLOR.teal};">${GLYPH_BIG} = 5</span><span style="color:${COLOR.teal};">${GLYPH_SMALL} = 1</span>
  </div>`;
  return `<div style="display:flex;flex-direction:column;">${rows}${legend}</div>`;
}

function buildU1T1(rng, mode){
  const mult = randInt(rng,1,4);
  const dmax = Math.floor(9/mult);
  const h = randInt(rng,1,dmax);
  const t = randInt(rng,0,dmax);
  const o = randInt(rng,0,dmax);
  const num = h*100+t*10+o;
  const ans = num*mult;
  return vmulHTML(String(num), String(mult), String(ans), mode);
}
function buildU1T2(rng, mode){
  const mult = randInt(rng,2,9);
  const oMin = Math.min(9, Math.ceil(10/mult));
  const o = randInt(rng, oMin, 9);
  const h = randInt(rng,1,9);
  const t = randInt(rng,0,9);
  const num = h*100+t*10+o;
  const ans = num*mult;
  return vmulHTML(String(num), String(mult), String(ans), mode);
}
function buildU1T3(rng, mode){
  const a = randInt(rng,11,99);
  const b = randInt(rng,11,99);

function buildU1T4(rng, mode){

/* =========================================================================
   5. Unit 2 — 나눗셈
   ========================================================================= */
const TENS_DIV_PAIRS = (() => {
  const out = [];
  for(let d=2; d<=9; d++){
    const maxBase = Math.max(1, Math.floor(9/d));
    for(let base=1; base<=maxBase; base++) out.push([d, base]);
  }
  return out;
})();
function buildU2T1(rng, mode){
  const [d, base] = pick(rng, TENS_DIV_PAIRS);
  const dividend = base*d*10;
  const quotient = base*10;
  return divCalc(String(dividend), String(d), String(quotient), mode);
}
function buildU2T2(rng, mode){
  const d = randInt(rng,2,9);
  const qMin = Math.max(2, Math.ceil(10/d));
  const q = randInt(rng, qMin, 9);
  const hasRem = rng() < 0.5;
  const r = hasRem ? randInt(rng,1,d-1) : 0;
  const dividend = q*d + r;
  const ansText = r>0 ? `${q}...${r}` : `${q}`;
  return divCalc(String(dividend), String(d), ansText, mode);
}
function buildU2T3(rng, mode){
  const item = pick(rng, DIV_ITEMS);
  const d = randInt(rng,2,6);
  const groups = randInt(rng,2,6);
  const hasRem = rng() < 0.5;
  const r = hasRem ? randInt(rng,1,d-1) : 0;
  const total = groups*d + r;
  const remText = r>0 ? `나머지 ${r}개` : '나머지 없음';
  return `<div class="fig-wrap">${poolIconsHTML(total, item.emoji, 260)}</div>
    <div class="qline">${item.name} ${total}개를 한 묶음에 ${d}개씩 나누어 담으면 몇 묶음이 되고, 남는 ${item.name}은(는) 몇 개인가요?${ansSpan(mode, `${groups}묶음, ${remText}`)}</div>`;
}
function buildU2T4(rng, mode){
  const d = randInt(rng,2,9);
  const qMin = Math.max(11, Math.ceil(100/d));
  const q = randInt(rng, qMin, 99);
  const hasRem = rng() < 0.5;
  const r = hasRem ? randInt(rng,1,d-1) : 0;
  const dividend = q*d + r;
  const ansText = r>0 ? `${q}...${r}` : `${q}`;
  return divCalc(String(dividend), String(d), ansText, mode);
}
function buildU2T5(rng, mode){
  const d = randInt(rng,2,9);
  const q = randInt(rng,2,15);
  const hasRem = rng() < 0.5;
  const r = hasRem ? randInt(rng,1,d-1) : 0;
  const dividend = q*d + r;
  const shown = r>0 ? `${dividend} ÷ ${d} = ${q}...${r}` : `${dividend} ÷ ${d} = ${q}`;
  return `<div class="qline">${shown}</div>
    <div class="qline">검산식: ${d} × ${q} + ${r} =${ansSpan(mode, String(dividend))}</div>`;
}

/* =========================================================================

function buildU4T1(rng, mode){
  const total = randInt(rng,3,8);
  const shaded = randInt(rng,1,total-1);
  return `<div class="fig-wrap">${fractionBarSVG(total, shaded, {w:168, color:COLOR.violet})}</div>

}
function buildU4T2(rng, mode){
  const groups = randInt(rng,2,5);
  const perGroup = randInt(rng,2,4);
  const num = randInt(rng,1,groups-1);
  const total = groups*perGroup;
  const ans = perGroup*num;
  return `<div class="fig-wrap">${fractionOfSetHTML(perGroup, groups, num, '●')}</div>
    <div class="qline">${total}의 ${fracInline(num,groups)} 은(는) 얼마인가요?${ansSpan(mode, `${ans}`)}</div>`;
}
function buildU4T3(rng, mode){
  const isProper = rng() < 0.5;
  const den = randInt(rng,2,9);
  const num = isProper ? randInt(rng,1,den-1) : randInt(rng,den,den+6);
  const label = num < den ? '진분수' : '가분수';
  return `<div class="fig-wrap">${fracInline(num,den)}</div>
    <div class="qline">이 분수는 진분수인가요, 가분수인가요?${ansSpan(mode, label)}</div>`;
}
function buildU4T4(rng, mode){
  const toImproper = rng() < 0.5;
  const den = randInt(rng,2,9);
  const whole = randInt(rng,1,4);
  const num = randInt(rng,1,den-1);
  const improper = whole*den+num;
  if(toImproper){
    return `<div class="qline">${whole}과 ${fracInline(num,den)} 을(를) 가분수로 나타내면?${ansSpan(mode, `${improper}/${den}`)}</div>`;
  }else{
    return `<div class="qline">${fracInline(improper,den)} 을(를) 대분수로 나타내면?${ansSpan(mode, `${whole}과 ${num}/${den}`)}</div>`;
  }
}
function buildU4T5(rng, mode){
  const den = randInt(rng,3,9);
  const [n1,n2] = pickDistinct(rng, Array.from({length:den-1},(_,i)=>i+1), 2);
  const bigger = n1>n2 ? n1 : n2;
  return `<div class="qline">${fracInline(n1,den)} 과(와) ${fracInline(n2,den)} 중 더 큰 분수는?${ansSpan(mode, `${bigger}/${den}`)}</div>`;
}

function buildU5T1(rng, mode){
  let total = randInt(rng,1100,3900);
  if(total%1000===0) total += 1;
  const L = Math.floor(total/1000), mL = total%1000;
  return `<div class="fig-wrap">${amountBarSVG(total,{maxVal:4000,w:190,color:COLOR.mint,unit:' mL'})}</div>
    <div class="qline">${total} mL는 몇 L 몇 mL인가요?${ansSpan(mode, `${L} L ${mL} mL`)}</div>`;
}
function buildU5T2(rng, mode){
  const val = randInt(rng,120,2880);
  const rounded = Math.round(val/100)*100;
  const item = pick(rng, CAP_ITEMS);
  return `<div class="fig-wrap"><span style="font-size:13pt;">${item.emoji}</span> ${amountBarSVG(val,{maxVal:3000,w:150,color:COLOR.mint,unit:' mL'})}</div>
    <div class="qline">${item.name}의 들이는 약 몇 mL로 어림할 수 있나요? (100 mL 단위)${ansSpan(mode, `약 ${rounded} mL`)}</div>`;
}
function buildU5T3(rng, mode){
  const L1=randInt(rng,1,4), mL1=randInt(rng,0,999);
  const L2=randInt(rng,1,4), mL2=randInt(rng,0,999);
  let sumML = mL1+mL2;
  const carry = Math.floor(sumML/1000);
  sumML %= 1000;
  const Lsum = L1+L2+carry;
  return `<div class="qline">🧴 ${L1} L ${mL1} mL + ${L2} L ${mL2} mL =${ansSpan(mode, ` ${Lsum} L ${sumML} mL`)}</div>`;
}
function buildU5T4(rng, mode){
  const L1=randInt(rng,2,9), mL1=randInt(rng,0,999);
  const L2=randInt(rng,1,L1), mL2=randInt(rng,0,999);
  let A=L1*1000+mL1, B=L2*1000+mL2;
  if(A<B){ const t=A; A=B; B=t; }
  if(A===B) A+=250;
  const diff=A-B;
  const dL=Math.floor(diff/1000), dmL=diff%1000;
  const aL=Math.floor(A/1000), amL=A%1000, bL=Math.floor(B/1000), bmL=B%1000;
  return `<div class="qline">🧴 ${aL} L ${amL} mL - ${bL} L ${bmL} mL =${ansSpan(mode, ` ${dL} L ${dmL} mL`)}</div>`;
}
function buildU5T5(rng, mode){
  let total = randInt(rng,1100,4900);
  if(total%1000===0) total += 1;
  const kg = Math.floor(total/1000), g = total%1000;
  return `<div class="fig-wrap">${amountBarSVG(total,{maxVal:5000,w:190,color:COLOR.sun,unit:' g'})}</div>
    <div class="qline">${total} g은 몇 kg 몇 g인가요?${ansSpan(mode, `${kg} kg ${g} g`)}</div>`;
}
function buildU5T6(rng, mode){
  const isAdd = rng() < 0.5;
  if(isAdd){
    const kg1=randInt(rng,1,4), g1=randInt(rng,0,999);
    const kg2=randInt(rng,1,4), g2=randInt(rng,0,999);
    let sumG = g1+g2;
    const carry = Math.floor(sumG/1000);
    sumG %= 1000;
    const kgSum = kg1+kg2+carry;
    return `<div class="qline">⚖️ ${kg1} kg ${g1} g + ${kg2} kg ${g2} g =${ansSpan(mode, ` ${kgSum} kg ${sumG} g`)}</div>`;
  }else{
    const kg1=randInt(rng,2,9), g1=randInt(rng,0,999);
    const kg2=randInt(rng,1,kg1), g2=randInt(rng,0,999);
    let A=kg1*1000+g1, B=kg2*1000+g2;
    if(A<B){ const t=A; A=B; B=t; }
    if(A===B) A+=250;
    const diff=A-B;
    const dKg=Math.floor(diff/1000), dG=diff%1000;
    const aKg=Math.floor(A/1000), aG=A%1000, bKg=Math.floor(B/1000), bG=B%1000;
    return `<div class="qline">⚖️ ${aKg} kg ${aG} g - ${bKg} kg ${bG} g =${ansSpan(mode, ` ${dKg} kg ${dG} g`)}</div>`;
  }
}

const UNIT = UNITS[3];
const TYPE = UNIT.types[1];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 3학년 2학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
</script>
</body>
</html>
