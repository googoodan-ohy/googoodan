<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1단원 수의 범위와 어림하기 - 유형2 초과와 미만</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
  }
  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;
    overflow-x:auto;
  }
  .preview-shadow{
    box-shadow:0 6px 24px rgba(20,30,60,.18);
  }

  /* ---------------- A4 Sheet ---------------- */
  .sheet{
    width:var(--page-w);
    height:var(--page-h);
    min-width:var(--page-w);
    min-height:var(--page-h);
    background:#fff;
    padding:var(--margin-y) var(--margin-x);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    flex:0 0 auto;
  }
  body.exporting .preview-shadow{ box-shadow:none; }

  .sheet .sh-header{ flex:0 0 auto; }

  .sh-cafe-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .sh-cafe-strip .cafe-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;
  }
  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;
    font-weight:600;
  }
  .sheet .sh-meta{
    display:flex;
    gap:16px;
    font-size:10.5pt;
    color:#374057;
  }
  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{
    display:flex;
    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:18px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }
  .fig-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>
</head>
<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & constants
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };

/* =========================================================================
   3. Shared render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
// All helpers below build with flexbox rather than CSS grid, since CSS grid
// can render unreliably through the html2canvas PDF/preview export path.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}

// ---- Number / fraction arithmetic helpers (exact, no floating point) ----
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function reduceFrac(n,d){ const g=gcd(n,d); return [n/g, d/g]; }
function trimTrailingZeros(s){
  if(s.indexOf('.')===-1) return s;
  s = s.replace(/0+$/,'');
  s = s.replace(/\.$/,'');
  return s;
}
function decStrFromTenths(x){ // x = value*10 (integer)
  const ip = Math.floor(x/10), fp = x%10;
  return fp===0 ? `${ip}` : `${ip}.${fp}`;
}
function decStrFromHundredths(x){ // x = value*100 (integer)
  const ip = Math.floor(x/100), fp = x%100;
  const fpStr = String(fp).padStart(2,'0');
  return trimTrailingZeros(`${ip}.${fpStr}`);
}

// ---- Fraction display (stacked num/den; divider follows currentColor so it
//      renders red automatically when nested inside ansSpan's .ans) ----
function fracHTML(num, den, opts={}){
  const fs = opts.fs || '13pt';
  return `<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle;font-size:${fs};font-weight:800;"><span>${num}</span><span style="border-top:2px solid currentColor;width:100%;min-width:1.4em;margin:1px 0;"></span><span>${den}</span></span>`;
}
function mixedHTML(intPart, num, den, opts={}){
  return `<span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;"><span style="font-size:${opts.fs||'13pt'};font-weight:800;">${intPart}</span>${fracHTML(num,den,opts)}</span>`;
}
function fracAnswerHTML(rn, rd){
  if(rd === 1) return String(rn);
  if(rn < rd) return fracHTML(rn, rd, {fs:'12pt'});
  const ip = Math.floor(rn/rd), rem = rn % rd;
  if(rem === 0) return String(ip);
  return mixedHTML(ip, rem, rd, {fs:'12pt'});
}
function fracRowHTML(partsHTML, ansSpanHTML){
  const row = partsHTML.map(p=>`<span style="display:inline-flex;align-items:center;">${p}</span>`).join(`<span style="font-size:14pt;font-weight:800;margin:0 8px;">×</span>`);
  return `<div style="display:flex;align-items:center;justify-content:center;gap:2px;margin:2px 0;">${row}<span style="font-size:14pt;font-weight:800;margin:0 8px;">=</span>${ansSpanHTML}</div>`;
}
function properFrac(rng, maxDen){
  const d = randInt(rng, 2, maxDen);
  const n = randInt(rng, 1, d-1);
  return [n,d];
}
function mixedNum(rng, maxInt, maxDen){
  const ip = randInt(rng, 1, maxInt);
  const [n,d] = properFrac(rng, maxDen);
  return [ip, n, d];
}

// ---- Number line: single boundary (이상/이하/초과/미만) ----
function boundaryLineSVG(boundary, closed, dir, w){
  const width = w || 200, height = 54, cx = width/2, y = 30;
  let s = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
  s += `<line x1="14" y1="${y}" x2="${width-14}" y2="${y}" stroke="${COLOR.ink}" stroke-width="2"/>`;
  s += `<polygon points="${width-14},${y} ${width-22},${y-5} ${width-22},${y+5}" fill="${COLOR.ink}"/>`;
  s += `<polygon points="14,${y} 22,${y-5} 22,${y+5}" fill="${COLOR.ink}"/>`;
  if(dir==='right'){ s += `<rect x="${cx}" y="${y-9}" width="${width-14-cx}" height="18" fill="${COLOR.coral}" opacity=".28"/>`; }
  else{ s += `<rect x="14" y="${y-9}" width="${cx-14}" height="18" fill="${COLOR.coral}" opacity=".28"/>`; }
  s += `<circle cx="${cx}" cy="${y}" r="6" fill="${closed?COLOR.coral:'#fff'}" stroke="${COLOR.coral}" stroke-width="2.5"/>`;
  s += `<text x="${cx}" y="${y-14}" font-size="13" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${boundary}</text>`;
  s += `</svg>`;
  return s;
}
// ---- Number line: two boundaries with shaded range between ----
function rangeLineSVG(low, lowClosed, high, highClosed, w){
  const width = w||220, height=54, y=30, x1=40, x2=width-40;
  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`;
  s += `<line x1="14" y1="${y}" x2="${width-14}" y2="${y}" stroke="${COLOR.ink}" stroke-width="2"/>`;
  s += `<polygon points="${width-14},${y} ${width-22},${y-5} ${width-22},${y+5}" fill="${COLOR.ink}"/>`;
  s += `<polygon points="14,${y} 22,${y-5} 22,${y+5}" fill="${COLOR.ink}"/>`;
  s += `<rect x="${x1}" y="${y-9}" width="${x2-x1}" height="18" fill="${COLOR.coral}" opacity=".28"/>`;
  s += `<circle cx="${x1}" cy="${y}" r="6" fill="${lowClosed?COLOR.coral:'#fff'}" stroke="${COLOR.coral}" stroke-width="2.5"/>`;
  s += `<circle cx="${x2}" cy="${y}" r="6" fill="${highClosed?COLOR.coral:'#fff'}" stroke="${COLOR.coral}" stroke-width="2.5"/>`;
  s += `<text x="${x1}" y="${y-14}" font-size="12.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${low}</text>`;
  s += `<text x="${x2}" y="${y-14}" font-size="12.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${high}</text>`;
  s += `</svg>`;
  return s;
}
// ---- Digit place-value tiles (highlights target place; digits below it are
//      shown dashed/gray to show they get "buried" by 올림/버림/반올림) ----
function digitTilesHTML(numStr, targetPos, decisionPos){
  const n = numStr.length;
  const placeNames = ['일의 자리','십의 자리','백의 자리','천의 자리','만의 자리','십만의 자리'];
  const cells = [];
  for(let i=0;i<n;i++){
    const posFromRight = n-1-i;
    const digit = numStr[i];
    const isTarget = posFromRight === targetPos;
    const isBelow = posFromRight < targetPos;
    const isDecision = decisionPos!=null && posFromRight === decisionPos;
    let style = 'background:#f3f5fa;color:#1f2430;border:2px solid #d7deed;';
    if(isTarget) style = `background:${COLOR.coral};color:#fff;border:2px solid ${COLOR.coral};`;
    else if(isDecision) style = `background:${COLOR.sun};color:#fff;border:2px solid ${COLOR.sun};`;
    else if(isBelow) style = 'background:#fff;color:#c7cbd6;border:2px dashed #d7deed;';
    cells.push(`<div style="${style}width:24px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12.5pt;font-weight:800;">${digit}</div>`);
  }
  const label = placeNames[targetPos] || '';
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
    <div style="display:flex;gap:2px;">${cells.join('')}</div>
    <div style="font-size:8pt;color:${COLOR.coral};font-weight:800;">▲ ${label}까지</div>
  </div>`;
}
function roundUpTo(n,p){ return n % p === 0 ? n : (Math.floor(n/p)+1)*p; }
function roundDownTo(n,p){ return Math.floor(n/p)*p; }
function roundNearestTo(n,p){
  const lower = Math.floor(n/p)*p;
  const decideDigit = Math.floor((n - lower) / (p/10));
  return decideDigit >= 5 ? lower + p : lower;
}
const ROUND_PLACES = [ {pos:1,label:'십'}, {pos:2,label:'백'}, {pos:3,label:'천'} ];

// ---- Congruent-triangle pair (fixed scalene template; 2nd triangle is a
//      horizontal mirror of the 1st, still congruent by reflection) ----
const TRI_A = [[20,92],[130,92],[75,18]];
function mirrorTri(pts, w){ return pts.map(p=>[w-p[0], p[1]]); }
function triangleSVG(pts, vertexLabels, angleTexts, edgeTexts, color, w, h){
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s += `<polygon points="${pts[0]} ${pts[1]} ${pts[2]}" fill="${color}" fill-opacity=".14" stroke="${color}" stroke-width="2.5"/>`;
  const cx=(pts[0][0]+pts[1][0]+pts[2][0])/3, cy=(pts[0][1]+pts[1][1]+pts[2][1])/3;
  pts.forEach((p,i)=>{
    const dx=p[0]-cx, dy=p[1]-cy, len=Math.hypot(dx,dy)||1;
    const lx=p[0]+dx/len*12, ly=p[1]+dy/len*12+3;

function spinnerSVG(n, k, colorA, colorB){
  const cx=45, cy=45, r=38;
  let s=`<svg width="90" height="90" viewBox="0 0 90 90">`;
  for(let i=0;i<n;i++){
    const a0 = -90 + i*360/n, a1 = -90 + (i+1)*360/n;
    const x0 = cx + r*Math.cos(a0*Math.PI/180), y0 = cy + r*Math.sin(a0*Math.PI/180);
    const x1 = cx + r*Math.cos(a1*Math.PI/180), y1 = cy + r*Math.sin(a1*Math.PI/180);
    const largeArc = (360/n) > 180 ? 1 : 0;
    const col = i < k ? colorA : colorB;
    s += `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${largeArc} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${col}" fill-opacity=".55" stroke="${COLOR.ink}" stroke-width="1.2"/>`;
  }

  s += `</svg>`;
  return s;
}

const AVG_CONTEXTS = [
  { label:'요일별 최고기온(℃)', cats:['월','화','수','목','금'] },
  { label:'모둠별 줄넘기 기록(회)', cats:['1모둠','2모둠','3모둠','4모둠'] },
  { label:'월별 도서 대출 권수(권)', cats:['3월','4월','5월','6월'] },
  { label:'요일별 방문객 수(명)', cats:['목','금','토','일'] },
];
function randValuesWithAvg(rng, n, avg, spread){
  const vals = []; let remaining = avg*n;
  for(let i=0;i<n-1;i++){
    const lo = Math.max(1, avg-spread), hi = avg+spread;
    const v = randInt(rng, lo, hi);
    vals.push(v); remaining -= v;
  }
  vals.push(remaining);
  return vals;
}
function buildU6T1(rng, mode){
  const ctx = pick(rng, AVG_CONTEXTS);
  const n = ctx.cats.length;
  const avg = randInt(rng, 5, 30);
  let vals, tries=0;
  do{ vals = randValuesWithAvg(rng, n, avg, 6); tries++; } while(vals.some(v=>v<1) && tries<20);
  const table = dataTableHTML(ctx.cats, vals);
  return `<div class="fig-wrap">${table}</div>
    <div class="qline">${ctx.label}입니다. 평균을 구하세요.${ansSpan(mode, `${avg}`)}</div>`;
}
function buildU6T2(rng, mode){
  const ctx = pick(rng, AVG_CONTEXTS);
  const n = ctx.cats.length;
  const avg = randInt(rng, 5, 30);
  let vals, tries=0;
  do{ vals = randValuesWithAvg(rng, n, avg, 6); tries++; } while(vals.some(v=>v<1) && tries<20);
  const hideIdx = randInt(rng, 0, n-1);
  const missing = vals[hideIdx];
  const shown = vals.map((v,i)=> i===hideIdx ? '?' : v);
  const table = dataTableHTML(ctx.cats, shown);
  return `<div class="fig-wrap">${table}</div>
    <div class="qline">${ctx.label}의 평균이 ${avg}일 때, ?에 알맞은 수는?${ansSpan(mode, `${missing}`)}</div>`;
}
function buildU6T3(rng, mode){
  const avgA = randInt(rng, 5, 25), avgB = randInt(rng, 5, 25);
  let valsA, valsB, tries=0;
  do{ valsA = randValuesWithAvg(rng, 4, avgA, 5); tries++; } while(valsA.some(v=>v<1) && tries<20);
  tries=0;
  do{ valsB = randValuesWithAvg(rng, 4, avgB, 5); tries++; } while(valsB.some(v=>v<1) && tries<20);
  const tableA = dataTableHTML(['1회','2회','3회','4회'], valsA, {cellW:36});
  const tableB = dataTableHTML(['1회','2회','3회','4회'], valsB, {cellW:36});
  const winner = avgA >= avgB ? 'A모둠' : 'B모둠';
  const wrap = `<div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div style="display:flex;align-items:center;gap:6px;"><b style="font-size:9pt;">A모둠</b>${tableA}</div>
    <div style="display:flex;align-items:center;gap:6px;"><b style="font-size:9pt;">B모둠</b>${tableB}</div>
  </div>`;
  return `<div class="fig-wrap">${wrap}</div>
    <div class="qline">A모둠과 B모둠의 기록입니다. 평균이 더 높은 모둠은?${ansSpan(mode, winner)}</div>`;
}
const POSSIBILITY_SITUATIONS = [
  { text:'계절은 봄, 여름, 가을, 겨울 네 번이 있습니다. 내년에도 겨울이 있을 가능성은?', ans:'확실하다' },

function buildU6T4(rng, mode){

function buildU6T5(rng, mode){
  const n = pick(rng, [2,4,5,6,8]);

    <div class="qline">회전판에서 화살표가 색칠된 부분에 멈출 가능성을 분수로 나타내면?${ansSpan(mode, ansHTML)}</div>`;
}

const UNIT = UNITS[0];
const TYPE = UNIT.types[1];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 5학년 2학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
