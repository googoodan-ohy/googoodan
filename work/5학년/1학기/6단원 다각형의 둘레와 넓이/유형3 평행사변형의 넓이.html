<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6단원 다각형의 둘레와 넓이 - 유형3 평행사변형의 넓이</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
  }
  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;
    overflow-x:auto;
  }
  .preview-shadow{
    box-shadow:0 6px 24px rgba(20,30,60,.18);
  }

  /* ---------------- A4 Sheet ---------------- */
  .sheet{
    width:var(--page-w);
    height:var(--page-h);
    min-width:var(--page-w);
    min-height:var(--page-h);
    background:#fff;
    padding:var(--margin-y) var(--margin-x);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    flex:0 0 auto;
  }
  body.exporting .preview-shadow{ box-shadow:none; }

  .sheet .sh-header{ flex:0 0 auto; }

  .sh-cafe-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .sh-cafe-strip .cafe-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;
  }
  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;
    font-weight:600;
  }
  .sheet .sh-meta{
    display:flex;
    gap:16px;
    font-size:10.5pt;
    color:#374057;
  }
  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{
    display:flex;
    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:18px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }
  .fig-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>
</head>
<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & shared math helpers
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };

function gcdNum(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a || 1; }
function lcmNum(a,b){ return a*b/gcdNum(a,b); }
function simplifyFrac(n,d){
  if(n===0) return [0,1];
  const g = gcdNum(n,d);
  return [n/g, d/g];
}
// Curated coprime (numerator<denominator) pairs — used wherever a fraction
// must be guaranteed already-in-simplest-form or two numbers guaranteed
// relatively prime, so ladder-division / reduction answers stay exact.
const COPRIME_PAIRS = [[2,3],[3,4],[2,5],[3,5],[4,5],[2,7],[3,7],[5,6],[4,7],[3,8],[5,7],[2,9],[5,8],[7,8],[3,10]];

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
// All helpers below build with flexbox rather than CSS grid, since CSS grid
// can render unreliably through the html2canvas PDF/preview export path.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
// Boxed highlight around a sub-expression (used to show which part of a
// mixed calculation must be computed first) — purely structural, so it is
// always shown identically in both modes.
function hlBox(html, color){
  return `<span style="display:inline-flex;align-items:baseline;border:2px solid ${color};border-radius:8px;padding:1px 7px;margin:0 2px;">${html}</span>`;
}
function nTag(v){ return `<span class="n">${v}</span>`; }
function opTag(v){ return `<span class="op">${v}</span>`; }

// ---- Vertical fraction (분수) as a small flex stack: n over line over d ----
function fracHTML(n, d, opts={}){
  const fs = opts.fs || '12.5pt';
  return `<span style="display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;margin:0 4px;">
    <span style="font-size:${fs};font-weight:800;padding:0 2px;">${n}</span>
    <span style="width:100%;min-width:18px;border-top:2px solid ${COLOR.ink};"></span>
    <span style="font-size:${fs};font-weight:800;padding:0 2px;">${d}</span>
  </span>`;
}
// ---- Mixed number (대분수): whole number + fraction, side by side ----
function mixedFracHTML(whole, n, d, opts={}){
  return `<span style="display:inline-flex;align-items:center;vertical-align:middle;">
    <span style="font-size:${opts.fs||'13pt'};font-weight:800;margin-right:1px;">${whole}</span>${fracHTML(n,d,opts)}
  </span>`;
}
// ---- Format a fraction result n/d as whole / mixed-number / proper fraction ----
function fracResultHTML(n, d){
  if(d===1) return `<span style="font-size:13pt;font-weight:800;">${n}</span>`;
  if(n===0) return `<span style="font-size:13pt;font-weight:800;">0</span>`;
  if(n>d){
    const whole = Math.floor(n/d), rem = n%d;
    if(rem===0) return `<span style="font-size:13pt;font-weight:800;">${whole}</span>`;
    return mixedFracHTML(whole, rem, d);
  }
  return fracHTML(n,d);
}
function fracAdd(n1,d1,n2,d2){
  const common = lcmNum(d1,d2);
  const num = n1*(common/d1) + n2*(common/d2);
  return simplifyFrac(num, common);
}

// ---- Ladder (사다리꼴) division diagram for finding GCF / LCM ----
// Draws the classic Korean-textbook "common factor" ladder: each row divides
// both numbers by one common prime factor, ending with the coprime leftovers.
function ladderDivisionHTML(a, b, divisors, color){
  let curA = a, curB = b;
  const cellStyle = 'min-width:30px;text-align:center;font-size:11.5pt;font-weight:800;';
  const rows = divisors.map(d=>{
    const row = `<div style="display:flex;align-items:center;gap:9px;">
      <span style="${cellStyle}color:${color};">${d}</span>
      <span style="font-weight:800;color:${color};">)</span>
      <span style="${cellStyle}">${curA}</span>
      <span style="${cellStyle}">${curB}</span>
    </div>`;
    curA = curA/d; curB = curB/d;
    return row;
  }).join('');
  const lastRow = `<div style="display:flex;align-items:center;gap:9px;padding-left:39px;border-top:2px solid ${COLOR.ink};margin-top:1px;padding-top:2px;">
    <span style="${cellStyle}">${curA}</span>
    <span style="${cellStyle}">${curB}</span>
  </div>`;
  return `<div style="display:inline-flex;flex-direction:column;gap:2px;">${rows}${lastRow}</div>`;
}

// ---- Correspondence table (대응관계 표): 2 rows, flexbox cells ----
function corrTableHTML(topLabel, topVals, bottomLabel, bottomVals, blankIdx, color){
  const cellW = 34, cellH = 26, labelW = 78;
  function row(label, vals, isBlankRow){
    const cells = [`<div style="width:${labelW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9pt;background:#f3f5fa;text-align:center;">${label}</div>`]
      .concat(vals.map((v,i)=>{
        const blank = isBlankRow && i===blankIdx;
        return `<div style="width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;font-size:10.5pt;font-weight:700;${blank?`background:${color};color:#fff;`:''}">${blank?'?':v}</div>`;
      }));
    return `<div style="display:flex;gap:1px;">${cells.join('')}</div>`;
  }
  return `<div style="display:inline-flex;flex-direction:column;gap:1px;border:1.5px solid #d7deed;padding:2px;">${row(topLabel, topVals, false)}${row(bottomLabel, bottomVals, true)}</div>`;
}

// ---- Rectangle / square with side labels (둘레·넓이 공통) ----
function rectSVG(w, h, opts={}){
  const scale = opts.scale || 6.4;
  const rw = Math.min(150, Math.max(46, w*scale)), rh = Math.min(96, Math.max(34, h*scale));
  const pad = 24;
  const totalW = rw+pad*2, totalH = rh+pad*2+6;
  const color = opts.color || COLOR.teal;
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`;
  s += `<rect x="${pad}" y="${pad}" width="${rw}" height="${rh}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  s += `<text x="${pad+rw/2}" y="${pad-7}" font-size="11" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${w} cm</text>`;
  s += `<text x="${pad-8}" y="${pad+rh/2+4}" font-size="11" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${h} cm</text>`;
  s += `</svg>`;
  return s;
}
// ---- Parallelogram with base/height labels, dashed height line ----
function parallelogramSVG(base, height, opts={}){
  const scale = opts.scale || 5.6;
  const bw = Math.min(128, Math.max(46, base*scale)), bh = Math.min(76, Math.max(30, height*scale));
  const skew = 24, pad = 24;
  const color = opts.color || COLOR.teal;
  const totalW = bw+skew+pad*2, totalH = bh+pad*2+16;
  const x0=pad+skew, y0=pad, x1=x0+bw, y1=y0, x2=x1-skew, y2=y0+bh, x3=x0-skew, y3=y2;
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`;
  s += `<polygon points="${x0},${y0} ${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  s += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y2}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2"/>`;
  s += `<text x="${(x3+x2)/2}" y="${y2+16}" font-size="10.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${base} cm</text>`;
  s += `<text x="${x0-8}" y="${(y0+y2)/2+4}" font-size="10.5" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${height} cm</text>`;
  s += `</svg>`;
  return s;
}
// ---- Triangle with base/height labels, dashed height line ----
function triangleSVG(base, height, opts={}){
  const scale = opts.scale || 5.6;
  const bw = Math.min(128, Math.max(46, base*scale)), bh = Math.min(78, Math.max(30, height*scale));
  const pad = 24;
  const color = opts.color || COLOR.teal;
  const totalW = bw+pad*2, totalH = bh+pad*2+16;
  const x0=pad, y0=pad+bh, x1=x0+bw, y1=y0, apexX=x0+bw*0.38, apexY=pad;
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`;
  s += `<polygon points="${x0},${y0} ${x1},${y1} ${apexX},${apexY}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  s += `<line x1="${apexX}" y1="${apexY}" x2="${apexX}" y2="${y0}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2"/>`;
  s += `<text x="${(x0+x1)/2}" y="${y0+16}" font-size="10.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${base} cm</text>`;
  s += `<text x="${apexX+8}" y="${(apexY+y0)/2+4}" font-size="10.5" text-anchor="start" font-weight="800" fill="${COLOR.ink}">${height} cm</text>`;
  s += `</svg>`;
  return s;
}
// ---- Trapezoid with top/bottom/height labels, dashed height line ----
function trapezoidSVG(top, bottom, height, opts={}){
  const scale = opts.scale || 5.0;
  const tw = Math.min(96, Math.max(30, top*scale)), bw = Math.min(140, Math.max(46, bottom*scale)), hh = Math.min(74, Math.max(30, height*scale));
  const pad = 24;
  const color = opts.color || COLOR.teal;
  const innerW = Math.max(tw,bw);
  const totalW = innerW+pad*2, totalH = hh+pad*2+16;
  const bx0 = pad + (innerW-bw)/2, bx1 = bx0+bw, by = pad+hh;
  const tx0 = pad + (innerW-tw)/2, tx1 = tx0+tw, ty = pad;
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`;
  s += `<polygon points="${tx0},${ty} ${tx1},${ty} ${bx1},${by} ${bx0},${by}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  s += `<line x1="${tx0}" y1="${ty}" x2="${tx0}" y2="${by}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2"/>`;
  s += `<text x="${(tx0+tx1)/2}" y="${ty-7}" font-size="10" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${top} cm</text>`;
  s += `<text x="${(bx0+bx1)/2}" y="${by+16}" font-size="10" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${bottom} cm</text>`;
  s += `<text x="${tx0-8}" y="${(ty+by)/2+4}" font-size="10" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${height} cm</text>`;
  s += `</svg>`;
  return s;
}
// ---- Rhombus with both diagonals labeled (dashed) ----
function rhombusSVG(d1, d2, opts={}){
  const scale = opts.scale || 5.6;
  const dw = Math.min(122, Math.max(46, d1*scale)), dh = Math.min(86, Math.max(34, d2*scale));
  const pad = 24;
  const color = opts.color || COLOR.teal;
  const totalW = dw+pad*2+30, totalH = dh+pad*2+16;
  const cx = pad+dw/2, cy = pad+dh/2;
  const top=[cx,pad], right=[pad+dw,cy], bottom=[cx,pad+dh], left=[pad,cy];
  let s = `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}">`;
  s += `<polygon points="${top.join(',')} ${right.join(',')} ${bottom.join(',')} ${left.join(',')}" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  s += `<line x1="${top[0]}" y1="${top[1]}" x2="${bottom[0]}" y2="${bottom[1]}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2"/>`;
  s += `<line x1="${left[0]}" y1="${left[1]}" x2="${right[0]}" y2="${right[1]}" stroke="${color}" stroke-width="1.4" stroke-dasharray="3,2"/>`;
  s += `<text x="${cx+6}" y="${pad-6}" font-size="10" text-anchor="start" font-weight="800" fill="${COLOR.ink}">${d1} cm</text>`;
  s += `<text x="${pad+dw+6}" y="${cy+4}" font-size="10" text-anchor="start" font-weight="800" fill="${COLOR.ink}">${d2} cm</text>`;
  s += `</svg>`;
  return s;
}

// T1: 덧셈과 뺄셈이 섞인 식 (왼쪽부터 순서대로), 3개 수
function buildU1T1(rng, mode){
  const ops = [pick(rng,['+','-']), pick(rng,['+','-'])];
  const a = randInt(rng, 20, 70);
  let cur = a;
  const parts = [a];
  ops.forEach(op=>{
    let b;
    if(op==='+'){ b = randInt(rng,4,35); cur = cur+b; }
    else { const capMax = Math.max(2, Math.min(cur,30)); b = randInt(rng, 1, capMax); cur = cur-b; }
    parts.push(op,b);
  });
  const html = `<span class="hcalc">${nTag(parts[0])}${opTag(parts[1])}${nTag(parts[2])}${opTag(parts[3])}${nTag(parts[4])}<span class="eq">=</span></span>${ansSpan(mode,String(cur))}`;
  return `<div class="qline">${html}</div>`;
}
// T2: 곱셈과 나눗셈이 섞인 식 (왼쪽부터 순서대로), 나눗셈이 항상 나누어떨어짐
function buildU1T2(rng, mode){
  const d = randInt(rng,2,9);
  const start = d * randInt(rng,2,9);
  const m = randInt(rng,2,9);
  const formA = rng() < 0.5;
  let tokens, ans;
  if(formA){
    ans = (start/d)*m;
    tokens = [start,'÷',d,'×',m];
  }else{
    ans = (start*m)/d;
    tokens = [start,'×',m,'÷',d];
  }
  const html = `<span class="hcalc">${nTag(tokens[0])}${opTag(tokens[1])}${nTag(tokens[2])}${opTag(tokens[3])}${nTag(tokens[4])}<span class="eq">=</span></span>${ansSpan(mode,String(ans))}`;
  return `<div class="qline">${html}</div>`;
}
// T3: 덧셈(뺄셈)과 곱셈이 섞인 식, 괄호 없음 — 곱셈 부분을 박스로 표시(먼저 계산)
function buildU1T3(rng, mode){
  const b = randInt(rng,2,9), c = randInt(rng,2,9);
  const mulVal = b*c;
  const mulHtml = hlBox(`${nTag(b)}${opTag('×')}${nTag(c)}`, COLOR.coral);
  const pattern = pick(rng, ['front_plus','front_minus','back_plus']);
  let a, ans, exprHtml;
  if(pattern === 'front_plus'){
    a = randInt(rng,10,60);
    ans = a+mulVal;
    exprHtml = `<span class="hcalc">${nTag(a)}${opTag('+')}${mulHtml}<span class="eq">=</span></span>`;
  }else if(pattern === 'front_minus'){
    a = mulVal + randInt(rng,5,50);
    ans = a-mulVal;
    exprHtml = `<span class="hcalc">${nTag(a)}${opTag('-')}${mulHtml}<span class="eq">=</span></span>`;
  }else{
    a = randInt(rng,10,60);
    ans = mulVal+a;
    exprHtml = `<span class="hcalc">${mulHtml}${opTag('+')}${nTag(a)}<span class="eq">=</span></span>`;
  }
  return `<div class="qline">${exprHtml}${ansSpan(mode,String(ans))}</div>`;
}
// T4: 괄호가 있는 사칙연산 혼합 계산 — 괄호 부분을 박스로 표시(먼저 계산)
function buildU1T4(rng, mode){
  const form = pick(rng,['mul','div']);
  let a,b,c,op1,inner,ans;
  if(form==='mul'){
    op1 = pick(rng,['+','-']);
    if(op1==='+'){ a = randInt(rng,5,35); b = randInt(rng,5,35); inner = a+b; }
    else { b = randInt(rng,3,25); a = b + randInt(rng,5,35); inner = a-b; }
    c = randInt(rng,2,9);
    ans = inner*c;
  }else{
    c = randInt(rng,2,9);
    inner = c*randInt(rng,2,9);
    op1 = pick(rng,['+','-']);
    if(op1==='+'){ a = randInt(rng,1,inner-1); b = inner-a; }
    else { b = randInt(rng,1,20); a = inner+b; }
    ans = inner/c;
  }
  const innerHtml = hlBox(`${nTag(a)}${opTag(op1)}${nTag(b)}`, COLOR.coral);
  const opOuter = form==='mul' ? '×' : '÷';
  const exprHtml = `<span class="hcalc">${opTag('(')}${innerHtml}${opTag(')')}${opTag(opOuter)}${nTag(c)}<span class="eq">=</span></span>`;
  return `<div class="qline">${exprHtml}${ansSpan(mode,String(ans))}</div>`;
}
// T5: 계산 순서 정하기 (구조 문제) — ㉠㉡㉢ 중 가장 먼저 계산할 부분 찾기
function buildU1T5(rng, mode){
  const nums = [randInt(rng,2,9),randInt(rng,2,9),randInt(rng,2,9),randInt(rng,2,9)];
  const hiIdx = randInt(rng,0,2);
  const hiOp = pick(rng,['×','÷']);
  const ops = [];
  for(let i=0;i<3;i++) ops.push(i===hiIdx ? hiOp : pick(rng,['+','-']));
  if(hiOp==='÷'){
    const dsr = randInt(rng,2,9);
    nums[hiIdx+1] = dsr;
    nums[hiIdx] = dsr*randInt(rng,2,9);
  }
  const labels = ['㉠','㉡','㉢'];
  const subVal = hiOp==='×' ? nums[hiIdx]*nums[hiIdx+1] : nums[hiIdx]/nums[hiIdx+1];
  const opCell = (i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:1px;"><span style="font-size:8pt;font-weight:800;color:#8a91a3;">${labels[i]}</span><span style="font-size:14pt;font-weight:800;">${ops[i]}</span></div>`;
  const row = `<div style="display:inline-flex;align-items:center;gap:9px;font-family:'Consolas','SF Mono',monospace;font-size:13pt;font-weight:700;">
    <span>${nums[0]}</span>${opCell(0)}<span>${nums[1]}</span>${opCell(1)}<span>${nums[2]}</span>${opCell(2)}<span>${nums[3]}</span>
  </div>`;
  const ansText = `${labels[hiIdx]} (${nums[hiIdx]}${ops[hiIdx]}${nums[hiIdx+1]}=${subVal})`;
  return `<div class="fig-wrap">${row}</div><div class="qline">㉠, ㉡, ㉢ 중에서 가장 먼저 계산해야 하는 것은 무엇인가요?${ansSpan(mode, ansText)}</div>`;
}

// T1: 크기가 같은 분수 만들기 (분모·분자에 같은 수 곱하기)
function buildU4T1(rng, mode){
  const n = randInt(rng,1,6), d = randInt(rng,n+1,9);

  const ansHtml = fracHTML(n*k, d*k);

}
// T2: 약분하여 기약분수로 나타내기
function buildU4T2(rng, mode){
  const [coN,coD] = pick(rng, COPRIME_PAIRS);
  const g = randInt(rng,2,6);
  const n = coN*g, d = coD*g;
  return `<div class="qline">${fracHTML(n,d)} 을(를) 약분하여 기약분수로 나타내세요.${ansSpan(mode, fracHTML(coN,coD))}</div>`;

// T3: 두 분수를 통분하기
function buildU4T3(rng, mode){
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const n1 = randInt(rng,1,d1-1), n2 = randInt(rng,1,d2-1);
  const common = lcmNum(d1,d2);
  const m1 = common/d1, m2 = common/d2;
  const cn1 = n1*m1, cn2 = n2*m2;
  return `<div class="fig-wrap">${fracHTML(n1,d1)}<span style="font-size:11pt;color:#8a91a3;margin:0 4px;">,</span>${fracHTML(n2,d2)}</div>
    <div class="qline">두 분수를 통분하세요.${ansSpan(mode, `${fracHTML(cn1,common)}<span style="font-size:11pt;color:#8a91a3;margin:0 4px;">,</span>${fracHTML(cn2,common)}`)}</div>`;
}
// T4: 통분하여 두 분수의 크기 비교하기
function buildU4T4(rng, mode){
  let d1,d2,n1,n2,common,c1,c2,tries=0;
  do{
    d1=randInt(rng,2,9); d2=randInt(rng,2,9);
    while(d2===d1) d2=randInt(rng,2,9);
    n1 = randInt(rng,1,d1-1); n2 = randInt(rng,1,d2-1);
    common = lcmNum(d1,d2);
    c1 = n1*(common/d1); c2 = n2*(common/d2);
    tries++;
  } while(c1===c2 && tries<20);
  const symbol = c1>c2 ? '>' : (c1<c2 ? '<' : '=');
  return `<div class="fig-wrap">${fracHTML(n1,d1)}<span style="font-size:14pt;font-weight:800;margin:0 8px;">○</span>${fracHTML(n2,d2)}</div>
    <div class="qline">두 분수의 크기를 비교하여 ○ 안에 &gt;, =, &lt; 를 알맞게 써넣으세요.${ansSpan(mode, symbol)}</div>`;
}
// T5: 기약분수인지 판별하기
function buildU4T5(rng, mode){
  const useReducible = rng() < 0.5;
  let n,d;
  if(useReducible){
    const [coN,coD] = pick(rng, COPRIME_PAIRS);
    const g = randInt(rng,2,5);
    n = coN*g; d = coD*g;
  }else{
    [n,d] = pick(rng, COPRIME_PAIRS);
  }
  const isIrreducible = gcdNum(n,d) === 1;
  return `<div class="qline">${fracHTML(n,d)} 은(는) 기약분수인가요? (예 / 아니요)${ansSpan(mode, isIrreducible ? '예' : '아니요')}</div>`;
}

function buildU5T1(rng, mode){
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const n1 = randInt(rng,1,d1-1), n2 = randInt(rng,1,d2-1);
  const [sn,sd] = fracAdd(n1,d1,n2,d2);
  const ansHtml = fracResultHTML(sn,sd);
  return `<div class="qline">${fracHTML(n1,d1)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">+</span>${fracHTML(n2,d2)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">=</span>${ansSpan(mode, ansHtml)}</div>`;
}
// T2: 분모가 다른 진분수의 뺄셈
function buildU5T2(rng, mode){
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const common = lcmNum(d1,d2);
  let n1,n2,c1,c2,tries=0;
  do{
    n1 = randInt(rng,1,d1-1); n2 = randInt(rng,1,d2-1);
    c1 = n1*(common/d1); c2 = n2*(common/d2);
    tries++;
  } while(c1<=c2 && tries<30);
  if(c1<=c2){ n1 = d1-1; c1 = n1*(common/d1); if(c1<=c2){ n2 = 1; c2 = n2*(common/d2); } }
  const [rn,rd] = simplifyFrac(c1-c2, common);
  const ansHtml = fracResultHTML(rn,rd);
  return `<div class="qline">${fracHTML(n1,d1)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">-</span>${fracHTML(n2,d2)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">=</span>${ansSpan(mode, ansHtml)}</div>`;
}
// T3: 분모가 다른 대분수의 덧셈
function buildU5T3(rng, mode){
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const n1 = randInt(rng,1,d1-1), n2 = randInt(rng,1,d2-1);
  const w1 = randInt(rng,1,5), w2 = randInt(rng,1,5);
  const common = lcmNum(d1,d2);
  const num = n1*(common/d1) + n2*(common/d2);
  let whole = w1+w2, rn = num, rd = common;
  if(rn >= rd){ whole += Math.floor(rn/rd); rn = rn % rd; }
  const [sn,sd] = rn===0 ? [0,1] : simplifyFrac(rn, rd);
  const ansHtml = sn===0 ? `<span style="font-size:13pt;font-weight:800;">${whole}</span>` : mixedFracHTML(whole,sn,sd);
  return `<div class="qline">${mixedFracHTML(w1,n1,d1)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">+</span>${mixedFracHTML(w2,n2,d2)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">=</span>${ansSpan(mode, ansHtml)}</div>`;
}
// T4: 분모가 다른 대분수의 뺄셈 (받아내림 포함 가능)
function buildU5T4(rng, mode){
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const n1 = randInt(rng,1,d1-1), n2 = randInt(rng,1,d2-1);
  const w1 = randInt(rng,3,8), w2 = randInt(rng,1,w1-1);
  const common = lcmNum(d1,d2);
  const c1 = n1*(common/d1), c2 = n2*(common/d2);
  let whole = w1-w2, rn = c1-c2;
  if(rn < 0){ whole -= 1; rn += common; }
  const [sn,sd] = rn===0 ? [0,1] : simplifyFrac(rn, common);
  const ansHtml = sn===0 ? `<span style="font-size:13pt;font-weight:800;">${whole}</span>` : mixedFracHTML(whole,sn,sd);
  return `<div class="qline">${mixedFracHTML(w1,n1,d1)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">-</span>${mixedFracHTML(w2,n2,d2)}<span style="font-size:15pt;font-weight:800;margin:0 6px;">=</span>${ansSpan(mode, ansHtml)}</div>`;
}
// T5: 분수의 덧셈 문장제
function buildU5T5(rng, mode){
  const item = pick(rng, FRAC_WORD_ITEMS);
  const unit = pick(rng, FRAC_WORD_UNITS);
  let d1,d2;
  do{ d1=randInt(rng,2,9); d2=randInt(rng,2,9); } while(d1===d2);
  const n1 = randInt(rng,1,d1-1), n2 = randInt(rng,1,d2-1);
  const [sn,sd] = fracAdd(n1,d1,n2,d2);
  const ansHtml = fracResultHTML(sn,sd);
  return `<div class="qline">${item}가 어제는 ${fracHTML(n1,d1)} ${unit}, 오늘은 ${fracHTML(n2,d2)} ${unit} 있었습니다. 어제와 오늘 양을 합하면 모두 몇 ${unit}인가요?${ansSpan(mode, ansHtml)}</div>`;
}

/* =========================================================================
   9. Unit 6 — 다각형의 둘레와 넓이
   ========================================================================= */
// T1: 직사각형·정사각형의 둘레
function buildU6T1(rng, mode){
  const isSquare = rng() < 0.4;
  const w = randInt(rng,4,20);
  const h = isSquare ? w : randInt(rng,4,20);
  const peri = 2*(w+h);
  return `<div class="fig-wrap">${rectSVG(w,h,{color:COLOR.teal})}</div>
    <div class="qline">${isSquare?'정사각형':'직사각형'}의 둘레는 몇 cm인가요?${ansSpan(mode, `${peri} cm`)}</div>`;
}
// T2: 직사각형·정사각형의 넓이
function buildU6T2(rng, mode){
  const isSquare = rng() < 0.4;
  const w = randInt(rng,4,20);
  const h = isSquare ? w : randInt(rng,4,20);
  const area = w*h;
  return `<div class="fig-wrap">${rectSVG(w,h,{color:COLOR.violet})}</div>
    <div class="qline">${isSquare?'정사각형':'직사각형'}의 넓이는 몇 cm²인가요?${ansSpan(mode, `${area} cm²`)}</div>`;
}
// T3: 평행사변형의 넓이 (밑변×높이)
function buildU6T3(rng, mode){
  const base = randInt(rng,5,18), height = randInt(rng,4,14);
  const area = base*height;
  return `<div class="fig-wrap">${parallelogramSVG(base,height,{color:COLOR.blue})}</div>
    <div class="qline">평행사변형의 넓이는 몇 cm²인가요?${ansSpan(mode, `${area} cm²`)}</div>`;
}
// T4: 삼각형의 넓이 (밑변×높이÷2)
function buildU6T4(rng, mode){
  const base = randInt(rng,4,20);
  let height = randInt(rng,4,16);
  if((base*height)%2 !== 0) height += 1;
  const area = (base*height)/2;
  return `<div class="fig-wrap">${triangleSVG(base,height,{color:COLOR.coral})}</div>
    <div class="qline">삼각형의 넓이는 몇 cm²인가요?${ansSpan(mode, `${area} cm²`)}</div>`;
}
// T5: 사다리꼴의 넓이 ((윗변+아랫변)×높이÷2)
function buildU6T5(rng, mode){
  const top = randInt(rng,3,10);
  const bottom = randInt(rng,top+2,20);
  let height = randInt(rng,4,14);
  if(((top+bottom)*height)%2 !== 0) height += 1;
  const area = ((top+bottom)*height)/2;
  return `<div class="fig-wrap">${trapezoidSVG(top,bottom,height,{color:COLOR.sun})}</div>
    <div class="qline">사다리꼴의 넓이는 몇 cm²인가요?${ansSpan(mode, `${area} cm²`)}</div>`;
}
// T6: 마름모의 넓이 (대각선×대각선÷2)
function buildU6T6(rng, mode){
  const d1 = randInt(rng,4,16);
  let d2 = randInt(rng,4,16);
  if((d1*d2)%2 !== 0) d2 += 1;
  const area = (d1*d2)/2;
  return `<div class="fig-wrap">${rhombusSVG(d1,d2,{color:COLOR.mint})}</div>
    <div class="qline">마름모의 넓이는 몇 cm²인가요?${ansSpan(mode, `${area} cm²`)}</div>`;
}

const UNIT = UNITS[5];
const TYPE = UNIT.types[2];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 5학년 1학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
