<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5단원 원의 넓이 - 유형4 원의 넓이 구하기</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;
  }
  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;
    overflow-x:auto;
  }
  .preview-shadow{
    box-shadow:0 6px 24px rgba(20,30,60,.18);
  }

  /* ---------------- A4 Sheet ---------------- */
  .sheet{
    width:var(--page-w);
    height:var(--page-h);
    min-width:var(--page-w);
    min-height:var(--page-h);
    background:#fff;
    padding:var(--margin-y) var(--margin-x);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    flex:0 0 auto;
  }
  body.exporting .preview-shadow{ box-shadow:none; }

  .sheet .sh-header{ flex:0 0 auto; }

  .sh-cafe-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .sh-cafe-strip .cafe-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;
  }
  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;
    font-weight:600;
  }
  .sheet .sh-meta{
    display:flex;
    gap:16px;
    font-size:10.5pt;
    color:#374057;
  }
  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{
    display:flex;
    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:18px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }
  .fig-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>
</head>
<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };

const DECIMAL_WORD_ITEMS = [
  { name:'주스', unit:'L' }, { name:'철사', unit:'m' }, { name:'쌀', unit:'kg' }, { name:'페인트', unit:'L' },
];
const RATIO_ITEMS_BANK = ['사탕', '구슬', '색종이', '연필', '초콜릿'];
const WORD_RATIO_PAIRS = [
  { thingA:'빵', unitA:'개', thingB:'밀가루', unitB:'컵' },
  { thingA:'사탕', unitA:'개', thingB:'설탕', unitB:'큰술' },
  { thingA:'과자', unitA:'봉지', thingB:'우유', unitB:'컵' },
  { thingA:'리본', unitA:'개', thingB:'끈', unitB:'m' },
];
const CIRCLE_ITEMS = ['시계', '접시', '피자', '원탁', '쟁반', '훌라후프'];

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. A
// "?" placeholder marking the unknown quantity is a literal, mode-independent
// glyph, never the real answer digit. All helpers build with flexbox rather
// than CSS grid, since CSS grid can render unreliably through the
// html2canvas PDF/preview export path. SVG fills use literal hex values
// (COLOR.*), never CSS var(), for stable html2canvas rendering.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=b; b=a%b; a=t; } return a || 1; }
function fmtNum(x, decimals){
  const d = decimals==null ? 2 : decimals;
  const f = Math.pow(10,d);
  return (Math.round(x*f)/f).toString();
}

// ---- Vertical fraction (분자/분모, flexbox column with a rule line) ----
function fracHTML(num, den, opts={}){
  const fs = opts.fs || '12.5pt';
  return `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-weight:800;font-size:${fs};line-height:1.2;margin:0 .12em;">
    <span>${num}</span>
    <span style="border-top:2px solid ${COLOR.ink};width:100%;min-width:1.3em;height:0;"></span>
    <span>${den}</span>
  </span>`;
}
function mixedHTML(whole, num, den, opts={}){
  return `<span style="display:inline-flex;align-items:center;vertical-align:middle;">
    <span style="font-weight:800;font-size:${opts.fs||'12.5pt'};margin-right:.15em;">${whole}</span>${fracHTML(num,den,opts)}
  </span>`;
}
// Reduce num/den to lowest terms and render as whole / mixed number / fraction.
function fracAnswerHTML(num, den){
  if(den===0) den = 1;
  if(num===0) return '<b>0</b>';
  const g = gcd(num,den);
  const n = num/g, d = den/g;
  if(d===1) return `<b>${n}</b>`;
  if(n>d){
    const whole = Math.floor(n/d), rem = n - whole*d;
    if(rem===0) return `<b>${whole}</b>`;
    return mixedHTML(whole, rem, d);
  }
  return fracHTML(n,d);
}
// Build one horizontal fraction equation line from tokens:
//   {type:'frac',num,den} | {type:'mixed',whole,num,den} | {type:'num',val} | {type:'op',sym}
function fracEqHTML(tokens, ansVal, mode){
  const inner = tokens.map(t=>{
    if(t.type==='frac')  return `<span class="n">${fracHTML(t.num,t.den)}</span>`;
    if(t.type==='mixed') return `<span class="n">${mixedHTML(t.whole,t.num,t.den)}</span>`;
    if(t.type==='num')   return `<span class="n">${t.val}</span>`;
    return `<span class="op">${t.sym}</span>`;
  }).join('');
  return `<span class="hcalc">${inner}<span class="eq">=</span></span>${ansSpan(mode, ansVal)}`;
}

// ---- Circle diagram: given radius or diameter labeled (literal given value) ----
function circleSVG(labelValue, opts={}){
  const size = opts.size || 100;
  const r = size/2-8, cx=size/2, cy=size/2;
  const color = opts.color || COLOR.blue;
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="2.4"/>`;
  if(opts.diameter){
    s += `<line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
    s += `<text x="${cx}" y="${cy-6}" font-size="10.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${labelValue}</text>`;
  }else{
    s += `<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
    s += `<text x="${cx+r/2}" y="${cy-6}" font-size="10.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${labelValue}</text>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="2" fill="${COLOR.ink}"/>`;
  s += `</svg>`;
  return s;
}

// ---- Cylinder (원기둥) with radius/height labeled ----
function cylinderSVG(labelR, labelH, opts={}){
  // canvasW leaves room to the right of the cylinder body for the height
  // label (line + text sit past cx+rx) so it isn't clipped by the viewBox.
  const w = opts.w || 110, rx=w/2-6, ry=14, topY=16, bodyH=70, cx=w/2, botY=topY+bodyH;
  const canvasW = w + 30;
  let s = `<svg width="${canvasW}" height="${botY+ry+10}" viewBox="0 0 ${canvasW} ${botY+ry+10}">`;
  s += `<line x1="${cx-rx}" y1="${topY}" x2="${cx-rx}" y2="${botY}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<line x1="${cx+rx}" y1="${topY}" x2="${cx+rx}" y2="${botY}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<ellipse cx="${cx}" cy="${botY}" rx="${rx}" ry="${ry}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<path d="M ${cx-rx} ${topY} A ${rx} ${ry} 0 0 0 ${cx+rx} ${topY}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8" stroke-dasharray="3,2"/>`;
  s += `<path d="M ${cx-rx} ${topY} A ${rx} ${ry} 0 0 1 ${cx+rx} ${topY}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<line x1="${cx}" y1="${topY}" x2="${cx}" y2="${topY+ry}" stroke="${COLOR.coral}" stroke-width="1.6"/>`;
  s += `<text x="${cx+8}" y="${topY+ry-2}" font-size="9" font-weight="800" fill="${COLOR.coral}">${labelR}</text>`;
  s += `<line x1="${cx+rx+10}" y1="${topY}" x2="${cx+rx+10}" y2="${botY}" stroke="${COLOR.blue}" stroke-width="1.4"/>`;
  s += `<text x="${cx+rx+13}" y="${(topY+botY)/2+3}" font-size="9" font-weight="800" fill="${COLOR.blue}">${labelH}</text>`;
  s += `</svg>`;
  return s;
}
// ---- Cylinder with one part (밑면/옆면/높이) highlighted and marked "?" ----
function cylinderPartSVG(part, opts={}){
  // canvasW leaves room to the right of the cylinder body for the 높이
  // (height) marker line + "?" label, which sits past cx+rx — without this
  // margin that marker is clipped outside the SVG viewBox and invisible.
  const w = opts.w || 110, rx=w/2-6, ry=14, topY=16, bodyH=opts.bodyH || 70, cx=w/2, botY=topY+bodyH;
  const canvasW = w + 22;
  let s = `<svg width="${canvasW}" height="${botY+ry+10}" viewBox="0 0 ${canvasW} ${botY+ry+10}">`;
  const sideFill = part==='옆면' ? 'rgba(77,150,255,.20)' : 'none';
  s += `<rect x="${cx-rx}" y="${topY}" width="${rx*2}" height="${bodyH}" fill="${sideFill}"/>`;
  s += `<line x1="${cx-rx}" y1="${topY}" x2="${cx-rx}" y2="${botY}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<line x1="${cx+rx}" y1="${topY}" x2="${cx+rx}" y2="${botY}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  const botFill = part==='밑면' ? 'rgba(255,126,103,.35)' : 'none';
  s += `<ellipse cx="${cx}" cy="${botY}" rx="${rx}" ry="${ry}" fill="${botFill}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<path d="M ${cx-rx} ${topY} A ${rx} ${ry} 0 0 0 ${cx+rx} ${topY}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8" stroke-dasharray="3,2"/>`;
  s += `<path d="M ${cx-rx} ${topY} A ${rx} ${ry} 0 0 1 ${cx+rx} ${topY}" fill="${botFill}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  if(part==='높이'){
    s += `<line x1="${cx+rx+10}" y1="${topY}" x2="${cx+rx+10}" y2="${botY}" stroke="${COLOR.coral}" stroke-width="2"/>`;

  }

    s += `<text x="${cx}" y="${(topY+botY)/2+4}" font-size="10.5" font-weight="800" text-anchor="middle" fill="${COLOR.blue}">?</text>`;
  }

    s += `<text x="${cx}" y="${botY+4}" font-size="10.5" font-weight="800" text-anchor="middle" fill="${COLOR.coral}">?</text>`;

// ---- Cone (원뿔) with one part (모선/높이/밑면) highlighted and marked "?" ----
function conePartSVG(part, opts={}){
  const w = opts.w || 110, rx=w/2-6, ry=12, apexY=10, baseY=opts.baseY || 90, cx=w/2;
  let s = `<svg width="${w}" height="${baseY+ry+10}" viewBox="0 0 ${w} ${baseY+ry+10}">`;
  s += `<line x1="${cx}" y1="${apexY}" x2="${cx-rx}" y2="${baseY}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<line x1="${cx}" y1="${apexY}" x2="${cx+rx}" y2="${baseY}" stroke="${part==='모선'?COLOR.blue:COLOR.ink}" stroke-width="${part==='모선'?2.6:1.8}"/>`;
  const botFill = part==='밑면' ? 'rgba(255,126,103,.35)' : 'none';
  s += `<ellipse cx="${cx}" cy="${baseY}" rx="${rx}" ry="${ry}" fill="${botFill}" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  if(part==='높이'){
    s += `<line x1="${cx}" y1="${apexY}" x2="${cx}" y2="${baseY}" stroke="${COLOR.coral}" stroke-width="1.8" stroke-dasharray="3,2"/>`;
    s += `<text x="${cx+6}" y="${(apexY+baseY)/2}" font-size="10" font-weight="800" fill="${COLOR.coral}">?</text>`;
  }
  if(part==='모선'){
    s += `<text x="${(cx+cx+rx)/2+7}" y="${(apexY+baseY)/2}" font-size="10" font-weight="800" fill="${COLOR.blue}">?</text>`;
  }
  if(part==='밑면'){
    s += `<text x="${cx}" y="${baseY+4}" font-size="10" font-weight="800" text-anchor="middle" fill="${COLOR.coral}">?</text>`;
  }
  s += `</svg>`;
  return s;
}
// ---- Sphere (구) with radius or diameter labeled ----
function sphereSVG(labelValue, opts={}){
  const size = opts.size || 90, r = size/2-8, cx=size/2, cy=size/2;
  let s = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.35}" fill="none" stroke="${COLOR.ink}" stroke-width="1.2" stroke-dasharray="3,2"/>`;
  if(opts.diameter){
    s += `<line x1="${cx-r}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${COLOR.coral}" stroke-width="1.6"/>`;
    s += `<text x="${cx}" y="${cy-6}" font-size="9.5" font-weight="800" text-anchor="middle" fill="${COLOR.coral}">${labelValue}</text>`;
  }else{
    s += `<line x1="${cx}" y1="${cy}" x2="${cx+r}" y2="${cy}" stroke="${COLOR.coral}" stroke-width="1.6"/>`;
    s += `<text x="${cx+r/2}" y="${cy-6}" font-size="9.5" font-weight="800" text-anchor="middle" fill="${COLOR.coral}">${labelValue}</text>`;
  }
  s += `</svg>`;
  return s;
}

// ---- 위에서 본 모양 숫자 배치도 (2행×3열, 각 칸 = 그 자리에 쌓은 개수) ----
function randomCubeGrid(rng){
  let grid, nonzero, sum;
  do{
    grid = [];
    for(let r=0;r<2;r++){ const row=[]; for(let c=0;c<3;c++){ row.push(randInt(rng,0,4)); } grid.push(row); }
    nonzero = grid.flat().filter(v=>v>0).length;
    sum = grid.flat().reduce((a,b)=>a+b,0);
  } while(nonzero<4 || sum<6);
  return grid;
}
function cubeGridHTML(grid){
  const cellW=40, cellH=32;
  const rows = grid.map(row=>{
    const cells = row.map(v=>`<div style="width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;font-size:13pt;font-weight:800;border:1.4px solid #d7deed;background:${v>0?'#f3f5fa':'#fff'};color:${v>0?COLOR.ink:'#c7cbd6'};">${v}</div>`).join('');
    return `<div style="display:flex;">${cells}</div>`;
  }).join('');
  return `<div style="display:inline-flex;flex-direction:column;align-items:center;gap:2px;">
    <div style="display:inline-flex;flex-direction:column;border:2px solid ${COLOR.ink};">${rows}</div>
    <div style="font-size:6.6pt;color:#8a91a3;font-weight:700;">숫자 = 그 자리에 쌓은 개수</div>
  </div>`;
}

// ---- Ratio bar for 비례배분 (segments proportional to a given ratio) ----
function barRatioSVG(aParts, bParts, opts={}){
  const totalParts = aParts+bParts;
  const w = opts.w || 190, h = 24;
  const segW = w/totalParts;
  let s = `<svg width="${w}" height="${h+14}" viewBox="0 0 ${w} ${h+14}">`;
  for(let i=0;i<totalParts;i++){
    const x = i*segW, isA = i<aParts;
    s += `<rect x="${x.toFixed(1)}" y="0" width="${segW.toFixed(1)}" height="${h}" fill="${isA?COLOR.blue:COLOR.coral}" stroke="#fff" stroke-width="1"/>`;
  }
  s += `<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="${COLOR.ink}" stroke-width="1.6"/>`;
  s += `<text x="${(aParts*segW/2).toFixed(1)}" y="${h+12}" font-size="9.5" text-anchor="middle" font-weight="800" fill="${COLOR.blue}">${aParts}</text>`;
  s += `<text x="${(aParts*segW + bParts*segW/2).toFixed(1)}" y="${h+12}" font-size="9.5" text-anchor="middle" font-weight="800" fill="${COLOR.coral}">${bParts}</text>`;
  s += `</svg>`;
  return s;
}

// ---- Small comparison fact table (원기둥/원뿔/구) ----
function factTableHTML(rowLabels, colLabels, data, blankR, blankC){
  const cellW=64, cellH=28;
  const header = `<div style="display:flex;">
    <div style="width:${cellW}px;height:${cellH}px;"></div>
    ${colLabels.map(c=>`<div style="width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;background:#f3f5fa;font-weight:800;font-size:8.4pt;text-align:center;padding:0 2px;">${c}</div>`).join('')}
  </div>`;
  const rows = rowLabels.map((rl,ri)=>{
    const cells = colLabels.map((c,ci)=>{
      const isBlank = ri===blankR && ci===blankC;
      const val = data[ri][ci];
      return `<div style="width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;font-size:10pt;font-weight:800;${isBlank?`background:${COLOR.coral};color:#fff;`:''}">${isBlank?'?':val}</div>`;
    }).join('');
    return `<div style="display:flex;margin-top:1px;">
      <div style="width:${cellW}px;height:${cellH}px;display:flex;align-items:center;justify-content:center;background:#f3f5fa;font-weight:800;font-size:9pt;">${rl}</div>
      ${cells}
    </div>`;
  }).join('');
  return `<div style="display:inline-block;border:1.5px solid #d7deed;padding:2px;">${header}${rows}</div>`;
}

function buildU4T2(rng, mode){

  if(askDiameter){

      <div class="qline">구의 지름은 몇 cm인가요?${ansSpan(mode, `${r*2} cm`)}</div>`;
  }
  const d = r*2;
  return `<div class="fig-wrap">${sphereSVG(`지름 ${d}cm`, {diameter:true})}</div>
    <div class="qline">구의 반지름은 몇 cm인가요?${ansSpan(mode, `${r} cm`)}</div>`;
}
function buildU6T5(rng, mode){
  const rowLabels = ['원기둥','원뿔','구'];
  const colLabels = ['밑면의 수','꼭짓점의 수'];
  const data = [[2,0],[1,1],[0,0]];
  const br = randInt(rng,0,2), bc = randInt(rng,0,1);
  const ans = data[br][bc];
  return `<div class="fig-wrap">${factTableHTML(rowLabels,colLabels,data,br,bc)}</div>
    <div class="qline">표의 빈칸에 알맞은 수는?${ansSpan(mode, String(ans))}</div>`;
}

const UNIT = UNITS[4];
const TYPE = UNIT.types[3];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 6학년 2학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
