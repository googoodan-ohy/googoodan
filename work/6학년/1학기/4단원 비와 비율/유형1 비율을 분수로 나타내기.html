<!DOCTYPE html>
<html lang="ko">
<head>

<title>4단원 비와 비율 - 유형1 비율을 분수로 나타내기</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }
  @media print{
    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }
    .ggd-sheet-wrap{ padding:0; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;
    --line:#333;
    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;
    --sun:#ffb100;
    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);

  .panel h2{
    font-size:14px;
    margin:0 0 10px;

    font-weight:700;

  .tabs{
    display:flex;
    flex-wrap:wrap;

  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;

    cursor:pointer;
    transition:.12s;

  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);

  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));

    font-size:12px;
    color:#6b7386;
    font-weight:600;

    flex-wrap:wrap;

    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;

  .btn.refresh{ background:#4a5268; }

  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

  .sh-cell.wide{

    align-items:stretch;

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.3pt; line-height:1.95; padding:2px 0; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>

<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks & visual glyphs
   ========================================================================= */
const COLOR = { coral:'#ff7e67', sun:'#ffb100', blue:'#4d96ff', violet:'#8a63d2', mint:'#20b39c', teal:'#2aa8c9', ink:'#1f2430' };
const PALETTE5 = [COLOR.coral, COLOR.sun, COLOR.blue, COLOR.violet, COLOR.teal];

const GAK_NAME = {3:'삼',4:'사',5:'오',6:'육',7:'칠',8:'팔',9:'구',10:'십'};
const PART_LABELS = ['면','모서리','꼭짓점'];

const FRAC_WORD_ITEMS = [
  { obj:'철사', unit:'m' }, { obj:'리본', unit:'m' }, { obj:'주스', unit:'L' },
  { obj:'설탕', unit:'kg' }, { obj:'끈', unit:'m' }, { obj:'페인트', unit:'L' },
];
const DEC_WORD_ITEMS = [
  { obj:'우유', unit:'L', container:'병' },
  { obj:'철사', unit:'m', container:'도막' },
  { obj:'설탕', unit:'kg', container:'봉지' },
  { obj:'주스', unit:'L', container:'병' },
  { obj:'끈', unit:'m', container:'도막' },
];
const RATIO_WORD_TOPICS = [
  { whole:'전체 학생 수', part:'안경을 쓴 학생 수', unit:'명' },
  { whole:'전체 구슬 수', part:'빨간 구슬 수', unit:'개' },
  { whole:'전체 사탕 수', part:'딸기 맛 사탕 수', unit:'개' },
  { whole:'전체 나무 수', part:'소나무 수', unit:'그루' },
];
const RATIO_TOPICS = [
  { label:'좋아하는 계절', cats:['봄','여름','가을','겨울'], itemsLabel:'학생' },
  { label:'좋아하는 운동', cats:['축구','야구','농구','줄넘기'], itemsLabel:'학생' },
  { label:'좋아하는 간식', cats:['과자','과일','빵','아이스크림'], itemsLabel:'학생' },
  { label:'가고 싶은 나라', cats:['미국','일본','프랑스','호주'], itemsLabel:'학생' },
];
const LINE_TOPICS = [
  { title:'교실 온도', unit:'℃', step:2, base:16 },
  { title:'화분 속 식물의 키', unit:'cm', step:5, base:5 },
  { title:'박물관 방문자 수', unit:'명', step:10, base:10 },
  { title:'우리 반 평균 키', unit:'cm', step:2, base:130 },
];
const WEEK_LABELS = ['1주','2주','3주','4주','5주'];
const PCT_DIVISORS = [4,5,10,20];

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
// IMPORTANT for every visual helper below: the picture itself must be
// IDENTICAL between problem-mode and answer-mode renders of the same random
// draw (givens only) — only ansSpan()-wrapped text may differ by mode. This
// keeps the per-sheet duplicate signature (which strips .ans spans) mode
// independent, so a problem sheet and its answer sheet stay in lockstep.
// All helpers below build with flexbox rather than CSS grid, since CSS grid
// can render unreliably through the html2canvas PDF/preview export path.
// At this grade level (6-1) picture/pictogram use is kept to a minimum —
// helpers below favor equations, tables, and the geometric/graph diagrams
// the curriculum itself requires (prisms/pyramids, boxes, line/band/pie
// graphs), rather than decorative icons.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
// Removes every `<span class="ans">...</span>` block from rendered HTML,
// including its answer content's own nested <span> markup (e.g. fraction
// answers built from fracHTML/mixedFracHTML). A plain non-greedy regex
// (`<span class="ans">[\s\S]*?<\/span>`) stops at the FIRST inner </span>
// it meets rather than the one that actually closes the outer .ans span,
// leaving stray markup in the signature — so this walks the string and
// counts nested <span> opens/closes to find the true matching close tag.
function stripAnsSpans(html){
  const openTag = '<span class="ans">';
  let out = '', i = 0;
  while(true){
    const idx = html.indexOf(openTag, i);
    if(idx === -1){ out += html.slice(i); break; }
    const cutStart = (idx > i && /\s/.test(html[idx-1])) ? idx-1 : idx;
    out += html.slice(i, cutStart);
    let depth = 1, pos = idx + openTag.length;
    while(depth > 0 && pos < html.length){
      const nextOpen = html.indexOf('<span', pos);
      const nextClose = html.indexOf('</span>', pos);
      if(nextClose === -1){ pos = html.length; break; }
      if(nextOpen !== -1 && nextOpen < nextClose){
        depth++;
        pos = html.indexOf('>', nextOpen) + 1;
      }else{
        depth--;
        pos = nextClose + '</span>'.length;
      }
    }
    i = pos;
  }
  return out;
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function calcRow(parts, mode, ansHTML){
  return `<span style="display:inline-flex;align-items:center;gap:.32em;font-size:12.5pt;font-weight:700;white-space:nowrap;">${parts.join('')}<span style="color:#555;font-weight:600;">=</span></span>${ansSpan(mode, ansHTML)}`;
}
function decFmt(intVal, p){
  const sign = intVal<0 ? '-' : '';
  const s = String(Math.abs(intVal)).padStart(p+1,'0');
  const intPart = s.slice(0, s.length-p);
  const fracPart = s.slice(s.length-p);
  return `${sign}${Number(intPart)}.${fracPart}`;
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function simplifyFrac(n,d){ const g=gcd(n,d); return [n/g, d/g]; }

// ---- Fraction display (분수 표기) ----
function fracHTML(num, den, opts={}){
  const fs = opts.fs || '12pt';
  return `<span style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:${fs};line-height:1.15;margin:0 3px;font-weight:800;">`
    + `<span>${num}</span>`
    + `<span style="border-top:1.8px solid ${COLOR.ink};min-width:1.6em;text-align:center;padding-top:1px;">${den}</span>`
    + `</span>`;
}
function mixedFracHTML(whole, num, den, opts={}){
  if(whole===0) return fracHTML(num,den,opts);
  return `<span style="display:inline-flex;align-items:center;vertical-align:middle;">`
    + `<span style="font-size:${opts.fs||'12pt'};font-weight:800;margin-right:2px;">${whole}</span>${fracHTML(num,den,opts)}`
    + `</span>`;
}
function formatFracAnswer(n,d){
  if(n%d===0) return `<span style="font-weight:800;">${n/d}</span>`;
  if(n>d){ const w=Math.floor(n/d), r=n%d; return mixedFracHTML(w,r,d); }
  return fracHTML(n,d);
}

// ---- Long-division bracket (세로 나눗셈) — quotient space stays "blank"
// except the ansSpan-wrapped text, divisor/dividend are always shown givens ----
function longDivHTML(divisor, dividendStr, mode, ansHTML){
  const padCh = String(divisor).length + 2;
  return `<div style="display:inline-flex;flex-direction:column;align-items:flex-start;font-family:'Consolas','SF Mono','Roboto Mono',monospace;font-size:13pt;font-weight:700;">`
    + `<div style="padding-left:${padCh}ch;min-height:1.3em;">${ansSpan(mode, ansHTML)}</div>`
    + `<div style="display:flex;align-items:stretch;">`
    + `<div style="padding-right:6px;border-right:2px solid ${COLOR.ink};display:flex;align-items:flex-end;padding-bottom:2px;">${divisor}</div>`
    + `<div style="border-top:2px solid ${COLOR.ink};padding:0 6px 2px 8px;">${dividendStr}</div>`
    + `</div></div>`;
}

// ---- Regular polygon point helpers (다각형 좌표) ----
function polygonPts(cx, cy, rx, ry, n, rot){
  rot = (rot===undefined) ? -90 : rot;
  const pts=[];
  for(let i=0;i<n;i++){
    const a = (rot + i*360/n) * Math.PI/180;
    pts.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);
  }
  return pts;
}
function ptsStr(pts){ return pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }

// ---- Flat polygon icon (밑면 모양 아이콘) ----
function polygonIconSVG(n, color, opts={}){
  const size = opts.size||60, r=size/2-4, cx=size/2, cy=size/2;
  const pts = polygonPts(cx,cy,r,r,n);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><polygon points="${ptsStr(pts)}" fill="${color}" fill-opacity=".3" stroke="${COLOR.ink}" stroke-width="1.8"/></svg>`;
}

// ---- Prism perspective sketch (각기둥 겨냥도) ----
function prismSVG(n, color, opts={}){
  const w = opts.w||140, topH=40, midGap=58;
  const cx = w/2;
  const rx = opts.rx || (w/2-16), ry = rx*0.36;
  const cyTop = topH, cyBot = topH+midGap;
  const top = polygonPts(cx,cyTop,rx,ry,n);
  const bot = polygonPts(cx,cyBot,rx,ry,n);
  const h = cyBot+ry+12;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    s += `<polygon points="${top[i][0].toFixed(1)},${top[i][1].toFixed(1)} ${top[j][0].toFixed(1)},${top[j][1].toFixed(1)} ${bot[j][0].toFixed(1)},${bot[j][1].toFixed(1)} ${bot[i][0].toFixed(1)},${bot[i][1].toFixed(1)}" fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="1.5"/>`;
  }
  s += `<polygon points="${ptsStr(top)}" fill="${color}" fill-opacity=".38" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `<polygon points="${ptsStr(bot)}" fill="none" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `</svg>`;
  return s;
}

// ---- Pyramid perspective sketch (각뿔 겨냥도) ----
function pyramidSVG(n, color, opts={}){
  const w = opts.w||140, baseY=96;
  const cx=w/2;
  const rx = opts.rx||(w/2-16), ry=rx*0.36;
  const base = polygonPts(cx,baseY,rx,ry,n);
  const apex = [cx, 12];
  let s=`<svg width="${w}" height="${baseY+ry+12}" viewBox="0 0 ${w} ${baseY+ry+12}">`;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    s += `<polygon points="${apex[0].toFixed(1)},${apex[1].toFixed(1)} ${base[i][0].toFixed(1)},${base[i][1].toFixed(1)} ${base[j][0].toFixed(1)},${base[j][1].toFixed(1)}" fill="${color}" fill-opacity=".16" stroke="${color}" stroke-width="1.5"/>`;
  }
  s += `<polygon points="${ptsStr(base)}" fill="${color}" fill-opacity=".3" stroke="${COLOR.ink}" stroke-width="1.8"/>`;
  s += `</svg>`;
  return s;
}

// ---- Oblique cuboid sketch (직육면체/정육면체 겨냥도), labeled with the
// three given edge lengths (always givens, never the answer). The depth
// extrusion (dx/dy) is capped in pixels rather than scaled linearly with
// d_, and every margin (top/bottom/left/right) is sized to fit its label
// text — otherwise the back-top edge and the width/height/depth labels
// can land at negative or out-of-viewBox coordinates and get silently
// clipped (an SVG's default overflow is hidden). ----
function boxSVG(w_, d_, h_, color, opts={}){
  const scale = opts.scale || 10;
  const fw = w_*scale, fh = h_*scale;
  const dExtrude = Math.min(34, 8 + d_*2.2);
  const dx = dExtrude, dyMag = dExtrude*0.6;
  const topPad = dyMag + 14, botPad = 16, leftPad = 20;
  const ox = leftPad, oy = topPad + fh;
  const flx=ox, fly=oy-fh, frx=ox+fw, fry=oy-fh;
  const fblx=ox, fbly=oy, fbrx=ox+fw, fbry=oy;
  const blx=flx+dx, bly=fly-dyMag, brx=frx+dx, bry=fry-dyMag;
  const bblx=fblx+dx, bbly=fbly-dyMag, bbrx=fbrx+dx, bbry=fbry-dyMag;
  const totalW = frx+dx+16, totalH = oy+botPad;
  let s=`<svg width="${totalW.toFixed(0)}" height="${totalH.toFixed(0)}" viewBox="0 0 ${totalW.toFixed(0)} ${totalH.toFixed(0)}">`;
  s+=`<polygon points="${blx.toFixed(1)},${bly.toFixed(1)} ${brx.toFixed(1)},${bry.toFixed(1)} ${bbrx.toFixed(1)},${bbry.toFixed(1)} ${bblx.toFixed(1)},${bbly.toFixed(1)}" fill="${color}" fill-opacity=".14" stroke="${color}" stroke-width="1.3" stroke-dasharray="3,2"/>`;
  s+=`<polygon points="${flx.toFixed(1)},${fly.toFixed(1)} ${frx.toFixed(1)},${fry.toFixed(1)} ${brx.toFixed(1)},${bry.toFixed(1)} ${blx.toFixed(1)},${bly.toFixed(1)}" fill="${color}" fill-opacity=".35" stroke="${COLOR.ink}" stroke-width="1.5"/>`;
  s+=`<polygon points="${frx.toFixed(1)},${fry.toFixed(1)} ${fbrx.toFixed(1)},${fbry.toFixed(1)} ${bbrx.toFixed(1)},${bbry.toFixed(1)} ${brx.toFixed(1)},${bry.toFixed(1)}" fill="${color}" fill-opacity=".55" stroke="${COLOR.ink}" stroke-width="1.5"/>`;
  s+=`<polygon points="${flx.toFixed(1)},${fly.toFixed(1)} ${frx.toFixed(1)},${fry.toFixed(1)} ${fbrx.toFixed(1)},${fbry.toFixed(1)} ${fblx.toFixed(1)},${fbly.toFixed(1)}" fill="${color}" fill-opacity=".28" stroke="${COLOR.ink}" stroke-width="1.9"/>`;
  s+=`<text x="${((flx+frx)/2).toFixed(1)}" y="${(fbly+13).toFixed(1)}" font-size="10.5" text-anchor="middle" font-weight="800" fill="${COLOR.ink}">${w_}</text>`;
  s+=`<text x="${(flx-7).toFixed(1)}" y="${((fly+fbly)/2+3).toFixed(1)}" font-size="10.5" text-anchor="end" font-weight="800" fill="${COLOR.ink}">${h_}</text>`;
  s+=`<text x="${((frx+brx)/2+4).toFixed(1)}" y="${((fry+bry)/2+3).toFixed(1)}" font-size="10.5" text-anchor="start" font-weight="800" fill="${COLOR.ink}">${d_}</text>`;
  s+=`</svg>`;
  return s;
}

// ---- Simple bar divided into b equal cells, first a shaded (비의 시각화).
// Total width is FIXED (not per-cell), so b as large as 20 never overflows
// its grid/list cell — cell width just shrinks to fit. ----
function ratioBarSVG(a, b, color, opts={}){
  const w = opts.w || 150, cellH = opts.cellH || 20, gap=1;
  const cellW = (w - (b-1)*gap) / b;
  let s = `<svg width="${w}" height="${cellH}" viewBox="0 0 ${w} ${cellH}">`;
  for(let i=0;i<b;i++){
    const x = i*(cellW+gap);
    const filled = i<a;
    s += `<rect x="${x}" y="0" width="${cellW}" height="${cellH}" fill="${filled?color:'#f3f5fa'}" stroke="${COLOR.ink}" stroke-width="1.1"/>`;
  }
  s += `</svg>`;
  return s;
}

// ---- Line graph (꺾은선그래프): gridlines at fixed step, no per-point
// number labels printed (student reads the value off the scale). The grid
// is scaled from the DATA'S OWN min..max (not from 0), so a topic whose
// values sit far from zero (e.g. "평균 키" around 130cm) still gets a
// short, fixed-ish number of gridlines instead of ~65 of them. ----
function lineGraphSVG(xLabels, values, step, color, opts={}){
  const w = opts.w||260, leftPad=26, rightPad=8, topPad=8, botPad=20;
  const minV = Math.min(...values), maxV = Math.max(...values);
  const gridMin = Math.floor(minV/step)*step;
  let gridMax = Math.ceil(maxV/step)*step;
  if(gridMax === gridMin) gridMax = gridMin + step;
  const range = gridMax - gridMin;
  const plotW = w-leftPad-rightPad;
  const rowH = 14, gridCount = Math.max(1, Math.round(range/step));
  const plotH = gridCount*rowH;
  const h = plotH+topPad+botPad;
  const n = xLabels.length;
  const stepX = plotW/(n-1);
  const yFor = v => topPad + plotH - ((v-gridMin)/range)*plotH;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let g=0; g<=gridCount; g++){
    const val = gridMin + g*step;
    const y = topPad+plotH-g*rowH;
    s += `<line x1="${leftPad}" y1="${y.toFixed(1)}" x2="${w-rightPad}" y2="${y.toFixed(1)}" stroke="#e1e5ee" stroke-width="1"/>`;
    s += `<text x="${leftPad-4}" y="${(y+3).toFixed(1)}" font-size="7.3" text-anchor="end" fill="#8a91a3">${val}</text>`;
  }
  s += `<line x1="${leftPad}" y1="${topPad}" x2="${leftPad}" y2="${(topPad+plotH).toFixed(1)}" stroke="${COLOR.ink}" stroke-width="1.4"/>`;
  s += `<line x1="${leftPad}" y1="${(topPad+plotH).toFixed(1)}" x2="${w-rightPad}" y2="${(topPad+plotH).toFixed(1)}" stroke="${COLOR.ink}" stroke-width="1.4"/>`;
  const pts = values.map((v,i)=>[leftPad+i*stepX, yFor(v)]);
  s += `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
  pts.forEach(p=>{ s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`; });
  xLabels.forEach((lab,i)=>{
    s += `<text x="${pts[i][0].toFixed(1)}" y="${h-6}" font-size="7.6" text-anchor="middle" fill="#4a5268" font-weight="700">${lab}</text>`;
  });
  s += `</svg>`;
  return s;
}

// ---- Band graph (띠그래프): segments proportional to percent; percent
// numbers appear only in the legend row below, never overlapping a thin
// segment (avoids overflow on small shares) ----
function bandGraphSVG(percents, colors, opts={}){
  const w = opts.w || 260, h = 26;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  let x=0;
  percents.forEach((p,i)=>{
    const seg = p/100*w;
    s += `<rect x="${x.toFixed(1)}" y="0" width="${seg.toFixed(1)}" height="${h}" fill="${colors[i]}" stroke="#fff" stroke-width="1.4"/>`;
    x+=seg;
  });
  s += `<rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="${COLOR.ink}" stroke-width="1.6"/>`;
  s += `</svg>`;
  return s;
}
// ---- Pie graph (원그래프) ----
function pieSVG(percents, colors, opts={}){
  const size = opts.size||110, r=size/2-4, cx=size/2, cy=size/2;
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  let angleStart=-90;
  percents.forEach((p,i)=>{
    const sweep = p/100*360;
    const angleEnd = angleStart+sweep;
    const x1=cx+r*Math.cos(angleStart*Math.PI/180), y1=cy+r*Math.sin(angleStart*Math.PI/180);
    const x2=cx+r*Math.cos(angleEnd*Math.PI/180), y2=cy+r*Math.sin(angleEnd*Math.PI/180);
    const largeArc = sweep>180?1:0;
    s += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${colors[i]}" stroke="#fff" stroke-width="1.4"/>`;
    angleStart = angleEnd;
  });
  s += `</svg>`;
  return s;
}
function legendRowHTML(cats,percents,colors){
  const chips = cats.map((c,i)=>`<span style="display:inline-flex;align-items:center;gap:3px;font-size:8pt;font-weight:700;color:#374057;"><span style="width:9px;height:9px;border-radius:2px;background:${colors[i]};display:inline-block;"></span>${c} ${percents[i]}%</span>`).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;">${chips}</div>`;
}
function genPercentSplit(rng, n, step){
  step = step||5;
  const totalUnits = 100/step;
  const parts = new Array(n).fill(1);
  let remaining = totalUnits - n;
  for(let i=0;i<remaining;i++){ parts[randInt(rng,0,n-1)]++; }
  return parts.map(p=>p*step);
}
function genLineValues(rng, topic){
  return WEEK_LABELS.map(()=> topic.base + topic.step*randInt(rng,0,7));
}

  const fig = `${bandGraphSVG(percents, colors)}${legendRowHTML(topic.cats, percents, colors)}`;
  return `<div class="fig-wrap"><div>${fig}</div></div>
    <div class="qline">${topic.itemsLabel}들이 ${topic.label}을(를) 조사한 띠그래프입니다. 가장 큰 비율을 차지하는 항목은?${ansSpan(mode, topic.cats[maxIdx])}</div>`;
}
function buildU5T4(rng, mode){
  const topic = pick(rng, RATIO_TOPICS);
  const percents = genPercentSplit(rng, topic.cats.length, 5);
  const colors = PALETTE5.slice(0, topic.cats.length);
  const useBand = rng()<0.5;
  const total = 20*randInt(rng,3,15);
  const j = randInt(rng,0,topic.cats.length-1);
  const count = percents[j]*total/100;
  const fig = useBand
    ? `${bandGraphSVG(percents, colors)}${legendRowHTML(topic.cats, percents, colors)}`
    : `${pieSVG(percents, colors)}${legendRowHTML(topic.cats, percents, colors)}`;
  return `<div class="fig-wrap"><div>${fig}</div></div>
    <div class="qline">전체 ${topic.itemsLabel} 수가 ${total}명일 때, ${topic.cats[j]}은(는) 몇 명인가요?${ansSpan(mode, `${count}명`)}</div>`;
}
function buildU5T5(rng, mode){
  const topic = pick(rng, RATIO_TOPICS);
  const percents = genPercentSplit(rng, topic.cats.length, 5);
  const colors = PALETTE5.slice(0, topic.cats.length);
  const maxV = Math.max(...percents), minV = Math.min(...percents);
  const fig = `${pieSVG(percents, colors)}${legendRowHTML(topic.cats, percents, colors)}`;
  return `<div class="fig-wrap"><div>${fig}</div></div>
    <div class="qline">${topic.itemsLabel}들이 ${topic.label}을(를) 조사한 원그래프입니다. 가장 큰 항목과 가장 작은 항목의 백분율의 차는 몇 %포인트인가요?${ansSpan(mode, `${maxV-minV}%포인트`)}</div>`;
}

/* =========================================================================
   9. Unit 6 — 직육면체의 부피와 겉넓이
   ========================================================================= */
function buildU6T1(rng, mode){
  const a=randInt(rng,2,8), b=randInt(rng,2,8), c=randInt(rng,2,8);
  const vol=a*b*c;
  return `<div class="fig-wrap">${boxSVG(a,b,c,COLOR.teal)}</div>
    <div class="qline">그림과 같은 직육면체의 부피를 구하세요.${ansSpan(mode, `${vol} cm³`)}</div>`;
}
function buildU6T2(rng, mode){
  const a=randInt(rng,2,12);
  const vol=a*a*a;
  return `<div class="fig-wrap">${boxSVG(a,a,a,COLOR.teal)}</div>
    <div class="qline">그림과 같은 정육면체의 부피를 구하세요.${ansSpan(mode, `${vol} cm³`)}</div>`;
}
function buildU6T3(rng, mode){
  const toCm3 = rng()<0.5;
  const m = randInt(rng,1,25);
  const cm3 = m*1000000;
  if(toCm3){
    return `<div class="qline">${m} m³는 몇 cm³인가요?${ansSpan(mode, `${cm3.toLocaleString()} cm³`)}</div>`;
  }
  return `<div class="qline">${cm3.toLocaleString()} cm³는 몇 m³인가요?${ansSpan(mode, `${m} m³`)}</div>`;
}
function buildU6T4(rng, mode){
  const a=randInt(rng,2,8), b=randInt(rng,2,8), c=randInt(rng,2,8);
  const sa = 2*(a*b+b*c+c*a);
  return `<div class="fig-wrap">${boxSVG(a,b,c,COLOR.teal)}</div>
    <div class="qline">그림과 같은 직육면체의 겉넓이를 구하세요.${ansSpan(mode, `${sa} cm²`)}</div>`;
}
function buildU6T5(rng, mode){
  const a=randInt(rng,2,12);
  const sa = 6*a*a;
  return `<div class="fig-wrap">${boxSVG(a,a,a,COLOR.teal)}</div>
    <div class="qline">그림과 같은 정육면체의 겉넓이를 구하세요.${ansSpan(mode, `${sa} cm²`)}</div>`;
}

const UNIT = UNITS[3];
const TYPE = UNIT.types[0];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 6학년 1학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
</script>
