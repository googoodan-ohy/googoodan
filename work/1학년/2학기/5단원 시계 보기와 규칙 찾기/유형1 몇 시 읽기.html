<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5단원 시계 보기와 규칙 찾기 - 유형1 몇 시 읽기</title>
<style>

  *{ box-sizing:border-box; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:14px; padding:16px;
  }
  .ggd-container{ max-width:900px; margin:0 auto; }
  .ggd-ad{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center; color:#9aa0a8;
    font-size:12px; font-weight:700; text-align:center; height:90px;
    margin-bottom:16px;
  }
  .ggd-toolbar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:flex-end; }
  .ggd-btn{
    padding:10px 14px; border:1.5px solid #e4e6ea; border-radius:8px;
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    color:#24262b;
  }
  .ggd-btn:hover{ border-color:#ff8961; background:#fff1ea; }
  .ggd-btn.ggd-active{ background:#ff8961; border-color:#ff8961; color:#fff; }
  .ggd-btn.ggd-primary{ background:#24262b; border-color:#24262b; color:#fff; }
  .ggd-btn.ggd-primary:hover{ background:#000; border-color:#000; }
  .ggd-sheet-wrap{ display:flex; justify-content:center; overflow-x:auto; padding-bottom:8px; }

    body{ padding:0; }
    .ggd-ad, .ggd-toolbar{ display:none; }

      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  @page{ size: A4; margin: 0; }


  :root{
    --page-w: 210mm;
    --page-h: 297mm;
    --margin-y: 14mm;
    --margin-x: 17mm;
    --ink:#1f2430;
    --accent:#20b39c;
    --accent2:#f2994a;

    --mint:#20b39c;
    --mint-dark:#0e8f7d;
    --coral:#ff7e67;

    --blue:#4d96ff;
    --violet:#8a63d2;
    --teal:#2aa8c9;
    --cream:#fff8ec;
    --red:#e0342a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:#eef1f6;
    color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------------- Screen-only control panel ---------------- */
  .app{
    max-width:1100px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .app-title{
    font-size:22px;
    font-weight:800;
    margin:0 0 4px;
  }
  .app-sub{
    font-size:13px;
    color:#5b6373;
    margin:0 0 20px;
  }
  .panel{
    background:#fff;
    border:1px solid #e1e5ee;
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:18px;
    box-shadow:0 1px 3px rgba(20,30,60,.05);

  .panel h2{
    font-size:14px;
    margin:0 0 10px;
    color:#374057;
    font-weight:700;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn{
    appearance:none;
    border:1px solid #d7deed;
    background:#f7f9fd;
    color:#4a5268;
    padding:9px 16px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.12s;

  .tab-btn:hover{ background:#eef2fb; }
  .tab-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-btn.mini{ padding:7px 12px; font-size:13px; }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px 14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b7386;
    font-weight:600;
  }
  .field input[type=text],
  .field input[type=number]{
    border:1px solid #d7deed;
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    font-family:inherit;
  }

  .action-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    transition:.12s;
  }
  .btn:disabled{ opacity:.55; cursor:progress; }
  .btn.refresh{ background:#4a5268; }
  .btn.refresh:hover:not(:disabled){ background:#3a4157; }
  .btn.pdf{ background:#d64545; }
  .btn.pdf:hover:not(:disabled){ background:#b93636; }
  .btn.preview{ background:#2f9e6e; }
  .btn.preview:hover:not(:disabled){ background:#24805a; }
  .status-msg{
    font-size:12.5px;
    color:#8a91a3;
  }
  .status-msg.err{ color:#c0392b; font-weight:600; }

  .view-toggle{
    display:flex;
    gap:6px;
    align-items:center;
    font-size:13px;
    color:#4a5268;
  }
  .view-toggle label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    padding:6px 10px;
    border:1px solid #d7deed;
    border-radius:8px;
  }
  .view-toggle input{ margin:0; }

  .preview-wrap{
    display:flex;
    justify-content:center;
    padding:10px 0 40px;

    background:var(--cream);
    color:var(--mint-dark);
    border:1.6px dashed var(--mint);
    border-radius:20px;
    padding:3px 13px;
    font-size:9.5pt;
    font-weight:800;

  .sh-cafe-strip .cafe-url{
    font-size:9pt;
    color:var(--coral);
    font-weight:800;
    letter-spacing:.01em;
  }

  .sheet .sh-titlebar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .sheet .sh-title{
    font-size:20pt;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .sheet .sh-title .op-badge{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-size:12.5pt;
    font-weight:700;
    padding:2px 12px;
    border-radius:20px;
    vertical-align:middle;
    white-space:nowrap;
  }
  .sheet .sh-title small{
    font-size:11pt;
    color:#6b7386;

  }
  .sheet .sh-meta{
    display:flex;

    font-size:10.5pt;

  .sheet .sh-meta span{ white-space:nowrap; }
  .sheet .sh-fields{

    gap:18px;
    font-size:10.5pt;
    color:#374057;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .sheet .sh-fields .f{ display:flex; align-items:center; gap:5px; }
  .sheet .sh-fields .f .ln{
    display:inline-block;
    border-bottom:1px solid #999;
    min-width:70px;
    height:1.1em;
  }
  .sheet .sh-fields .f b{ display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
  .sheet .sh-rule{
    height:3px;
    margin:9px 0 4px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .sheet main.sh-main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    gap:10px;
    min-height:0;
  }
  .sh-row{
    display:flex;
    flex-direction:row;
    justify-content:space-evenly;
    align-items:stretch;
    gap:20px;
  }
  .sh-row.wide{ justify-content:flex-start; width:100%; }
  .sh-cell{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
  }
  .sh-cell.wide{
    width:100%;
    align-items:stretch;
    justify-content:center;
  }

  .sheet .sh-footer{
    flex:0 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:7px;
    border-top:1.5px dashed var(--mint);
    font-size:9pt;
    color:#8a91a3;
  }
  .sheet .sh-footer .tagline{ font-weight:700; color:var(--mint-dark); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .sheet .sh-footer .brand{
    font-style:normal;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:360px;
  }
  .sheet .sh-footer .pageno::before{ content:"p. "; }

  /* ---------------- Problem content pieces ---------------- */
  .qline{ font-size:11.5pt; line-height:1.95; padding:2px 0; }
  .shape-row{ font-size:15pt; letter-spacing:.14em; margin:1px 0; }

  .ans{
    color:var(--red);
    font-weight:800;
  }

  .hcalc{
    font-family:"Consolas","SF Mono","Roboto Mono",monospace;
    font-size:12.5pt;
    display:inline-flex;
    align-items:baseline;
    gap:.35em;
    white-space:nowrap;
  }
  .hcalc .n{ font-weight:700; display:inline-block; }
  .hcalc .op{ font-weight:800; }
  .hcalc .eq{ color:#555; }

  .clock-wrap{ display:flex; justify-content:center; margin-bottom:2px; }

  @media print{
    body{ background:#fff; }
    .app > .panel, .app-title, .app-sub{ display:none; }
    .preview-wrap{ padding:0; }
  }

</style>

<body>

<div class="ggd-container">
  <div class="ggd-ad">광고 영역 (728 × 90)</div>

  <div class="ggd-toolbar">
    <button class="ggd-btn ggd-active" id="btnProblem" onclick="setMode('problem')">문제지</button>
    <button class="ggd-btn" id="btnAnswer" onclick="setMode('answer')">정답지</button>
    <button class="ggd-btn" onclick="regenerate()">숫자변경</button>
    <button class="ggd-btn ggd-primary" onclick="window.print()">프린트</button>
  </div>

  <div class="ggd-sheet-wrap">
    <div class="sheet" id="sheetHost"></div>
  </div>
</div>

<script>

/* =========================================================================
   1. Seeded RNG helpers
   ========================================================================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randInt(rng, min, max){ return Math.floor(rng() * (max - min + 1)) + min; }
function pick(rng, arr){ return arr[randInt(rng, 0, arr.length-1)]; }
function pickDistinct(rng, arr, n){
  const pool = arr.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    const idx = randInt(rng, 0, pool.length-1);
    out.push(pool[idx]);
    pool.splice(idx,1);
  }
  return out;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   2. Word banks
   ========================================================================= */
const NAMES_BANK = ['서윤','하람','지우','다인','은서','민준','하은','도윤'];
const COUNT_OBJS = ['구슬','바둑돌','사탕','연결큐브','클립','붙임딱지'];
const TENS_WORDS = { 6:['육십','예순'], 7:['칠십','일흔'], 8:['팔십','여든'], 9:['구십','아흔'] };

const STORY_ADD = [
  (a,b)=>`나뭇가지에 참새가 ${a}마리 앉아 있었는데 ${b}마리가 더 날아왔습니다.`,
  (a,b)=>`어항에 금붕어가 ${a}마리 있었는데 ${b}마리를 더 넣었습니다.`,
  (a,b)=>`바구니에 사과가 ${a}개 있었는데 ${b}개를 더 담았습니다.`,
  (a,b)=>`주차장에 자동차가 ${a}대 있었는데 ${b}대가 더 들어왔습니다.`,
];
const STORY_SUB = [
  (a,b)=>`연필이 ${a}자루 있었는데 ${b}자루를 동생에게 주었습니다.`,
  (a,b)=>`풍선이 ${a}개 있었는데 ${b}개가 터졌습니다.`,
  (a,b)=>`나뭇가지에 새 ${a}마리가 있었는데 ${b}마리가 날아갔습니다.`,
  (a,b)=>`사탕이 ${a}개 있었는데 ${b}개를 먹었습니다.`,
];
const STORY_ADD3 = [
  (a,b)=>`구슬 ${a}개가 있었는데 ${b}개를 더 모았습니다.`,
  (a,b)=>`붙임딱지 ${a}장을 가지고 있었는데 ${b}장을 더 받았습니다.`,
  (a,b)=>`줄넘기를 ${a}번 넘었는데 ${b}번을 더 넘었습니다.`,
];
const STORY_SUB3 = [
  (a,b)=>`구슬 ${a}개 중에서 ${b}개를 친구에게 주었습니다.`,
  (a,b)=>`색종이 ${a}장 중에서 ${b}장을 사용했습니다.`,
  (a,b)=>`사탕 ${a}개 중에서 ${b}개를 먹었습니다.`,
];

const SHAPE3_NAMES = { box:'상자 모양', cyl:'둥근기둥 모양', ball:'공 모양' };
const SHAPE3_ITEMS = {
  box:  ['냉장고','필통','서랍장','상자','주사위','세탁기'],
  cyl:  ['음료수 캔','화장지심','양초','북','페인트통','보온병'],
  ball: ['축구공','농구공','지구본','수박','구슬','비치볼'],
};
const SHAPE3_DESC = {
  box:  ['평평한 면이 있고, 뾰족한 부분도 있습니다.',
         '평평한 면끼리 잘 쌓을 수 있습니다.',
         '어느 방향으로도 잘 굴러가지 않습니다.'],
  cyl:  ['평평한 면과 둥근 면이 함께 있습니다.',
         '눕히면 잘 굴러가지만, 세우면 쌓을 수 있습니다.',
         '위아래는 평평하고 옆은 둥근 면입니다.'],
  ball: ['평평한 면이 하나도 없습니다.',
         '어느 방향으로도 잘 굴러갑니다.',
         '뾰족한 부분 없이 동그란 모양입니다.'],
};
const SHAPE3_GLYPH = { box:'📦', cyl:'🥫', ball:'⚽' };
const SHAPE3_THEME = ['자동차 놀이', '성 쌓기', '로봇 만들기', '기차 만들기'];
const CIRCLE_NUMS = ['①','②','③','④','⑤','⑥'];

const PATTERN_SYMS = ['🔴','🔵','🟡','🟢','⭐','⬛'];

/* =========================================================================
   3. Small render helpers
   ========================================================================= */
// No fill-in boxes or underlines: on problem sheets nothing is shown where an
// answer would go; on answer sheets the answer appears inline in red.
function ansSpan(mode, text){
  return mode==='answer' ? ` <span class="ans">${text}</span>` : '';
}
function hcalc(aStr, opSym, bStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${opSym}</span><span class="n">${bStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function hcalc3(aStr, op1, bStr, op2, cStr, ansVal, mode){
  return `<span class="hcalc"><span class="n">${aStr}</span><span class="op">${op1}</span><span class="n">${bStr}</span><span class="op">${op2}</span><span class="n">${cStr}</span><span class="eq">=</span></span>${ansSpan(mode, String(ansVal))}`;
}
function clockSVG(hour, minute){
  const size=92, cx=size/2, cy=size/2, r=size/2-5;
  const hourAngle = ((hour%12)*30 + minute*0.5) - 90;
  const minAngle = minute*6 - 90;
  const rad = d => d*Math.PI/180;
  const hx = (cx + r*0.52*Math.cos(rad(hourAngle))).toFixed(1);
  const hy = (cy + r*0.52*Math.sin(rad(hourAngle))).toFixed(1);
  const mx = (cx + r*0.80*Math.cos(rad(minAngle))).toFixed(1);
  const my = (cy + r*0.80*Math.sin(rad(minAngle))).toFixed(1);
  let ticks = '';
  for(let i=0;i<12;i++){
    const a = rad(i*30-90);
    const x1=(cx+r*0.86*Math.cos(a)).toFixed(1), y1=(cy+r*0.86*Math.sin(a)).toFixed(1);
    const x2=(cx+r*Math.cos(a)).toFixed(1), y2=(cy+r*Math.sin(a)).toFixed(1);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#888" stroke-width="${i%3===0?2:1}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#333" stroke-width="2.5"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="#1f2430" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="#1f2430" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="#1f2430"/>
  </svg>`;
}

/* =========================================================================
   4. Unit 1 — 100까지의 수
   ========================================================================= */
function buildU1T1(rng, mode){
  const t = randInt(rng,6,9);
  const val = t*10;
  const w = TENS_WORDS[t];
  return `<div class="qline">10개씩 묶음이 ${t}개이면 얼마인가요? 두 가지 방법으로 읽어 보세요.${ansSpan(mode, `${val} · ${w[0]}(${w[1]})`)}</div>`;
}
function buildU1T2(rng, mode){
  const tens = randInt(rng,1,9), ones = randInt(rng,0,9);
  const val = tens*10+ones;
  const obj = pick(rng, COUNT_OBJS);
  return `<div class="qline">${obj}이(가) 10개씩 묶음 ${tens}개와 낱개 ${ones}개가 있습니다. 모두 몇 개인가요?${ansSpan(mode, `${val}개`)}</div>`;
}
function buildU1T3(rng, mode){
  const n = randInt(rng,2,98);
  return `<div class="qline">${n}보다 1만큼 더 큰 수와 1만큼 더 작은 수를 각각 구해 보세요.${ansSpan(mode, `${n+1} , ${n-1}`)}</div>`;
}
function buildU1T4(rng, mode){
  let x,y; do{ x=randInt(rng,10,99); y=randInt(rng,10,99); } while(x===y);
  const askBig = rng() < 0.5;
  const word = askBig ? '더 큰' : '더 작은';
  const ans = askBig ? Math.max(x,y) : Math.min(x,y);
  return `<div class="qline">${x}과(와) ${y} 중에서 ${word} 수는 무엇인가요?${ansSpan(mode, String(ans))}</div>`;
}
function buildU1T5(rng, mode){
  const n = randInt(rng,1,99);
  const isEven = n%2===0;
  return `<div class="qline">${n}은(는) 짝수인가요, 홀수인가요?${ansSpan(mode, isEven?'짝수':'홀수')}</div>`;
}
function buildU1T6(rng, mode){
  const nums = [];
  while(nums.length<3){ const v=randInt(rng,10,99); if(!nums.includes(v)) nums.push(v); }
  const askBig = rng() < 0.5;
  const word = askBig ? '가장 큰' : '가장 작은';
  const ans = askBig ? Math.max(...nums) : Math.min(...nums);
  return `<div class="qline">${nums.join(', ')} 중에서 ${word} 수는 무엇인가요?${ansSpan(mode, String(ans))}</div>`;
}

/* =========================================================================
   5. Unit 2 — 덧셈과 뺄셈(1) (받아올림·받아내림 없음)
   ========================================================================= */
function buildU2T1(rng, mode){
  const tensA = randInt(rng,1,8), onesA = randInt(rng,0,8);
  const a = tensA*10+onesA;
  const b = randInt(rng,1,9-onesA);
  return hcalc(a,'+',b,a+b,mode);
}
function buildU2T2(rng, mode){
  const tensA = randInt(rng,1,9), onesA = randInt(rng,1,9);
  const a = tensA*10+onesA;
  const b = randInt(rng,1,onesA);
  return hcalc(a,'-',b,a-b,mode);
}
function buildU2T3(rng, mode){
  const tensA = randInt(rng,1,8), onesA = randInt(rng,0,8);
  const a = tensA*10+onesA;
  const tensB = randInt(rng,1,9-tensA), onesB = randInt(rng,0,9-onesA);
  const b = tensB*10+onesB;
  return hcalc(a,'+',b,a+b,mode);
}
function buildU2T4(rng, mode){
  const tensA = randInt(rng,1,9), onesA = randInt(rng,0,9);
  const a = tensA*10+onesA;
  const tensB = randInt(rng,1,tensA), onesB = randInt(rng,0,onesA);
  const b = tensB*10+onesB;
  return hcalc(a,'-',b,a-b,mode);
}
function buildU2T5(rng, mode){
  const a = randInt(rng,1,4);
  const b = randInt(rng,1,8-a);
  const c = randInt(rng,1,9-a-b);
  return hcalc3(a,'+',b,'+',c,a+b+c,mode);
}
function buildU2T6(rng, mode){
  const a = randInt(rng,6,9);
  const b = randInt(rng,1,a-2);
  const c = randInt(rng,1,a-b-1);
  return hcalc3(a,'-',b,'-',c,a-b-c,mode);
}

/* =========================================================================
   6. Unit 3 — 여러 가지 모양 (입체도형)
   ========================================================================= */
function buildU3T1(rng, mode){
  const keys = ['box','cyl','ball'];
  const target = pick(rng, keys);
  const others = keys.filter(k=>k!==target);
  const correct = pickDistinct(rng, SHAPE3_ITEMS[target], 2);
  const distractPool = SHAPE3_ITEMS[others[0]].concat(SHAPE3_ITEMS[others[1]]);
  const distract = pickDistinct(rng, distractPool, 3);
  const all = correct.concat(distract);
  for(let i=all.length-1;i>0;i--){ const j=randInt(rng,0,i); [all[i],all[j]]=[all[j],all[i]]; }
  const listHtml = all.map((it,idx)=> `${CIRCLE_NUMS[idx]} ${it}`).join('&nbsp;&nbsp;');
  return `<div class="qline">다음 물건 중에서 ${SHAPE3_NAMES[target]}인 것을 모두 찾아 ○표 하세요.</div>
    <div class="qline">${listHtml}${ansSpan(mode, correct.join(', '))}</div>`;
}
function buildU3T2(rng, mode){
  const keys = ['box','cyl','ball'];
  const target = pick(rng, keys);
  const desc = pick(rng, SHAPE3_DESC[target]);
  return `<div class="qline">다음 설명에 알맞은 모양은 무엇인가요?</div>
    <div class="qline">"${desc}"${ansSpan(mode, SHAPE3_NAMES[target])}</div>`;
}
function buildU3T3(rng, mode){
  let box,cyl,ball;
  do{ box=randInt(rng,2,7); cyl=randInt(rng,2,7); ball=randInt(rng,2,7); }
  while(box===cyl || cyl===ball || box===ball);
  const rows = [
    {g:SHAPE3_GLYPH.box, name:SHAPE3_NAMES.box, n:box},
    {g:SHAPE3_GLYPH.cyl, name:SHAPE3_NAMES.cyl, n:cyl},
    {g:SHAPE3_GLYPH.ball, name:SHAPE3_NAMES.ball, n:ball},
  ];
  const shapeRows = rows.map(r=> `<div class="shape-row"><b>${r.name}:</b> ${new Array(r.n).fill(r.g).join(' ')}${mode==='answer'? ` <span class="ans">(${r.n}개)</span>`:''}</div>`).join('');
  const max = rows.reduce((m,r)=> r.n>m.n? r:m, rows[0]);
  return `<div class="qline">아래 모양의 개수를 세어 보세요.</div>
    ${shapeRows}
    <div class="qline">가장 많이 사용된 모양은 무엇이고 몇 개인가요?${ansSpan(mode, `${max.name} ${max.n}개`)}</div>`;
}
function buildU3T4(rng, mode){
  const theme = pick(rng, SHAPE3_THEME);
  const c1 = randInt(rng,2,6), c2 = randInt(rng,2,6);
  return `<div class="qline">${theme}을(를) 하면서 ${SHAPE3_NAMES.box} ${c1}개와 ${SHAPE3_NAMES.cyl} ${c2}개를 사용했습니다. 사용한 모양은 모두 몇 개인가요?${ansSpan(mode, `${c1+c2}개`)}</div>`;
}

/* =========================================================================
   7. Unit 4 — 덧셈과 뺄셈(2) (한 자리 수, 받아올림·받아내림 있음)
   ========================================================================= */
function buildU4T1(rng, mode){
  const a = randInt(rng,3,9);
  const b = randInt(rng, Math.max(2,11-a), 9);
  return hcalc(a,'+',b,a+b,mode);
}
function buildU4T2(rng, mode){
  const total = randInt(rng,11,18);
  const b = randInt(rng, Math.max(2,total-9), 9);
  return hcalc(total,'-',b,total-b,mode);
}
function buildU4T3(rng, mode){
  const a = randInt(rng,3,9);
  const b = randInt(rng, Math.max(2,11-a), 9);
  const t = pick(rng, STORY_ADD);
  return `<div class="qline">${t(a,b)} 식을 쓰고 답을 구해 보세요.${ansSpan(mode, `${a}+${b}=${a+b}`)}</div>`;
}
function buildU4T4(rng, mode){
  const total = randInt(rng,11,18);
  const b = randInt(rng, Math.max(2,total-9), 9);
  const t = pick(rng, STORY_SUB);
  return `<div class="qline">${t(total,b)} 식을 쓰고 답을 구해 보세요.${ansSpan(mode, `${total}-${b}=${total-b}`)}</div>`;
}
function buildU4T5(rng, mode){
  if(rng() < 0.5){
    const a = randInt(rng,3,9);
    const b = randInt(rng, Math.max(2,11-a), 9);
    return hcalc(a,'+',b,a+b,mode);
  }else{
    const total = randInt(rng,11,18);
    const b = randInt(rng, Math.max(2,total-9), 9);
    return hcalc(total,'-',b,total-b,mode);
  }
}

/* =========================================================================
   8. Unit 5 — 시계 보기와 규칙 찾기
   ========================================================================= */
function buildU5T1(rng, mode){
  const hour = randInt(rng,1,12);
  return `<div class="clock-wrap">${clockSVG(hour,0)}</div>
    <div class="qline">시계가 나타내는 시각을 써 보세요.${ansSpan(mode, `${hour}시`)}</div>`;
}
function buildU5T2(rng, mode){
  const hour = randInt(rng,1,12);
  return `<div class="clock-wrap">${clockSVG(hour,30)}</div>
    <div class="qline">시계가 나타내는 시각을 써 보세요.${ansSpan(mode, `${hour}시 30분`)}</div>`;
}
function buildU5T3(rng, mode){
  const unitLen = pick(rng,[2,3]);
  const syms = pickDistinct(rng, PATTERN_SYMS, unitLen);
  const seqLen = unitLen*3;
  const seq = [];
  for(let i=0;i<seqLen;i++) seq.push(syms[i%unitLen]);
  const nextTwo = [syms[seqLen%unitLen], syms[(seqLen+1)%unitLen]];
  return `<div class="qline" style="font-size:19pt;letter-spacing:.12em;">${seq.join(' ')}</div>
    <div class="qline">규칙에 맞게 다음에 올 모양 두 개를 써 보세요.${ansSpan(mode, nextTwo.join(' '))}</div>`;
}
function buildU5T4(rng, mode){
  const step = pick(rng,[1,2,5,10]);
  const start = randInt(rng, 1, 99 - step*4);
  const seq = [start, start+step, start+2*step];
  const nextTwo = [start+3*step, start+4*step];
  return `<div class="qline">규칙에 맞게 다음에 이어질 수 두 개를 써 보세요.</div>
    <div class="qline">${seq.join(', ')}${ansSpan(mode, `→ ${nextTwo.join(', ')}`)}</div>`;
}

/* =========================================================================
   9. Unit 6 — 덧셈과 뺄셈(3) (두 자리 수, 받아올림·받아내림 있음)
   ========================================================================= */
function buildU6T1(rng, mode){
  const tensA = randInt(rng,1,8), onesA = randInt(rng,1,9);
  const a = tensA*10+onesA;
  const b = randInt(rng, Math.max(1,10-onesA), 9);
  return hcalc(a,'+',b,a+b,mode);
}
function buildU6T2(rng, mode){
  const tensA = randInt(rng,1,9), onesA = randInt(rng,0,8);
  const a = tensA*10+onesA;
  const b = randInt(rng, onesA+1, 9);
  return hcalc(a,'-',b,a-b,mode);
}
function buildU6T3(rng, mode){
  if(rng() < 0.5){
    const tensA = randInt(rng,1,8), onesA = randInt(rng,1,9);
    const a = tensA*10+onesA;
    const b = randInt(rng, Math.max(1,10-onesA), 9);
    const t = pick(rng, STORY_ADD3);
    return `<div class="qline">${t(a,b)} 식을 쓰고 답을 구해 보세요.${ansSpan(mode, `${a}+${b}=${a+b}`)}</div>`;
  }else{
    const tensA = randInt(rng,1,9), onesA = randInt(rng,0,8);
    const a = tensA*10+onesA;
    const b = randInt(rng, onesA+1, 9);
    const t = pick(rng, STORY_SUB3);
    return `<div class="qline">${t(a,b)} 식을 쓰고 답을 구해 보세요.${ansSpan(mode, `${a}-${b}=${a-b}`)}</div>`;
  }
}
function buildU6T4(rng, mode){
  const b = randInt(rng,2,9);
  const a0 = randInt(rng,2,7);
  const line1 = `${a0}+${b}=${a0+b}`;
  const line2 = `${a0+1}+${b}=${a0+1+b}`;
  return `<div class="qline">${line1},&nbsp;&nbsp;${line2},&nbsp;&nbsp;${a0+2}+${b}=?</div>
    <div class="qline">규칙을 찾아 답을 구해 보세요.${ansSpan(mode, String(a0+2+b))}</div>`;
}

/* =========================================================================
   10. Unit / Type registry

const UNITS = [

    types:[

      { name:'받아내림이 있는 뺄셈', layout:'grid', cols:4, rows:6, build:buildU4T2 },
      { name:'받아올림 덧셈 문장제', layout:'list', cols:1, rows:6, build:buildU4T3 },

  { key:'u5', num:'5', title:'시계 보기와 규칙 찾기', color:'var(--violet)',
    types:[
      { name:'몇 시 읽기', layout:'grid', cols:3, rows:4, build:buildU5T1 },

      { name:'규칙적인 계산식에서 규칙 찾기', layout:'list', cols:1, rows:6, build:buildU6T4 },
    ]},
];


const UNIT = UNITS[4];
const TYPE = UNIT.types[0];
const TYPE_BUILD = TYPE.build;

let mode = 'problem';
let seed = Date.now() % 1000000007;

function buildUniqueProblem(rng, mode, seen){
  let html, sig, tries = 0;
  do{
    html = TYPE_BUILD(rng, mode);
    sig = html.replace(/<span class="ans">[\s\S]*?<\/span>/g, '');
    tries++;
  } while(seen.has(sig) && tries < 25);
  seen.add(sig);
  return html;
}
function wrapList(inner){ return `<div class="sh-row wide"><div class="sh-cell wide">${inner}</div></div>`; }
function wrapGrid(inner){ return `<div class="sh-cell">${inner}</div>`; }

function buildSheetInner(mode, seed){
  const rng = mulberry32(seed);
  const modeLabel = mode === 'answer' ? '정답지' : '문제지';
  const seen = new Set();
  let rowsHtml = '';
  if(TYPE.layout === 'grid'){
    for(let r=0; r<TYPE.rows; r++){
      let cells = '';
      for(let c=0; c<TYPE.cols; c++){
        cells += wrapGrid(buildUniqueProblem(rng, mode, seen));
      }
      rowsHtml += `<div class="sh-row">${cells}</div>`;
    }
  }else{
    for(let i=0;i<TYPE.rows;i++){
      rowsHtml += wrapList(buildUniqueProblem(rng, mode, seen));
    }
  }

  return `
    <div class="sh-header">
      <div class="sh-cafe-strip">
        <span class="cafe-badge">🔢 구구단닷컴</span>
        <span class="cafe-url">www.googoodan.com</span>
      </div>
      <div class="sh-titlebar">
        <div class="sh-title">
          <span class="op-badge" style="background:${UNIT.color};">${UNIT.num}단원</span>
          ${TYPE.name} <small>· ${UNIT.title}</small>
        </div>
      </div>
      <div class="sh-fields">
        <span class="f">학습일자 <span class="ln"></span></span>
        <span class="f">대상 <b>초등 1학년 2학기</b></span>
        <span class="f">이름 <span class="ln"></span></span>
        <span class="f">점수 <span class="ln"></span></span>
      </div>
      <div class="sh-rule" style="background:linear-gradient(90deg, ${UNIT.color}, #20b39c);"></div>
    </div>
    <main class="sh-main">${rowsHtml}</main>
    <div class="sh-footer">
      <span class="tagline">매일 10분, 수학 자신감을 키워요 ✏️</span>
      <span class="brand">🔢 구구단닷컴 · www.googoodan.com</span>
      <span class="pageno"></span>
    </div>
  `;
}

function render(){
  document.getElementById('sheetHost').innerHTML = buildSheetInner(mode, seed);
}
function setMode(m){
  mode = m;
  document.getElementById('btnProblem').classList.toggle('ggd-active', m === 'problem');
  document.getElementById('btnAnswer').classList.toggle('ggd-active', m === 'answer');
  render();
}
function regenerate(){
  seed = Math.floor(Math.random() * 1e9);
  render();
}
render();
</script>
