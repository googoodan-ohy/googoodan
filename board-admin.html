<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>게시판 운영자 관리 | googoodan.</title><link rel="stylesheet" href="/community.css?v=20260910"><script defer src="/community-config.js?v=20260910"></script><script defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script><script defer src="/board-admin.js?v=20260910"></script><script defer src="/admin-stats.js?v=20260910"></script><style>.stats-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.stats-tools label{display:grid;gap:4px}.stats-tools input,.stats-tools select{padding:8px;max-width:100%}.stats-scroll{overflow:auto}#statsPanel{padding:20px 0;border-bottom:1px solid #ddd;margin-bottom:24px}#statsPanel table{width:100%;border-collapse:collapse}#statsPanel td,#statsPanel th{padding:9px;text-align:right;border-bottom:1px solid #eee}#statsPanel th:first-child,#statsPanel td:first-child{text-align:left}#statsChart{display:flex;align-items:end;gap:3px;height:140px;min-width:280px;margin:20px 0}#statsChart div{flex:1;background:#278779;min-height:2px}#statsSummary{font-size:20px;font-weight:700}</style></head><body><header><a href="/board.html">← 게시판</a><strong>운영자 관리</strong><button id="logout" hidden>로그아웃</button></header><main><h1>게시판 관리</h1><p>운영자는 모든 글과 댓글을 삭제할 수 있습니다. 글을 삭제하면 해당 댓글도 함께 삭제됩니다.</p><form id="login"><label>관리자 비밀번호 <input id="password" type="password" autocomplete="current-password" required></label><button class="primary">로그인</button><div id="bot"></div></form><p id="status" role="status"></p><section id="manage" hidden><section id="statsPanel"><h2>문제 유형 로딩 통계</h2><p>한국 시간 기준 · 한국어/영어는 이용한 사이트 구분입니다. 실제 광고 노출 수와 다릅니다.</p><form id="statsForm" class="stats-tools"><label>시작일<input id="statsStart" type="date" required></label><label>종료일<input id="statsEnd" type="date" required></label><label>사이트<select id="statsSite"><option value="all">전체</option><option value="ko">한국어</option><option value="en">영어</option></select></label><label>단위<select id="statsUnit"><option value="day">일별</option><option value="month">월별</option></select></label><button>조회</button><button type="button" id="statsCsv">CSV 다운로드</button></form><p id="statsNotice" role="status"></p><p id="statsSummary"></p><div class="stats-scroll"><div id="statsChart" aria-label="유형 로딩 추이"></div><table><thead><tr><th>기간</th><th>한국어</th><th>영어</th><th>합계</th></tr></thead><tbody id="statsRows"></tbody></table></div></section><form id="searchForm" class="search"><input id="query" type="search" placeholder="제목 검색" aria-label="제목 검색"><button>검색</button></form><div id="list"></div><button id="more" hidden>더 보기</button></section><section id="detail" hidden><h2 id="detailTitle"></h2><p><a id="publicLink" href="/board.html" target="_blank" rel="noopener">게시판 열기</a></p><div id="comments"></div></section></main></body></html>
