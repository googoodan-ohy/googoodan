<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용후기 게시판 - 구구단닷컴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
<style>
  :root{
    --primary:#ff8961;
    --primary-dark:#ef6f43;
    --primary-light:#fff1ea;
    --line:#e4e6ea;
    --ink:#24262b;
    --muted:#7b8087;
    --paper:#ffffff;
    --bg:#f4f5f7;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Pretendard','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    font-size:14px;
    background:var(--bg);
    min-height:100vh;
  }

  .page{ max-width:1760px; margin:0 auto; padding:18px; }

  /* ---- 사이트 헤더 ---- */
  .site-header{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:20px 26px; margin-bottom:14px; min-height:92px;
  }
  .site-logo{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .site-logo .mark{
    width:52px; height:52px; border-radius:16px; flex-shrink:0;
    background:linear-gradient(135deg, #ffc93c, #ff8961 55%, #ff6b81);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; box-shadow:0 6px 14px rgba(255,137,97,.35);
    transform:rotate(-4deg);
  }
  .site-logo .brand-text{ display:flex; flex-direction:column; }
  .site-logo .name{ font-size:23px; font-weight:900; color:var(--ink); letter-spacing:-.02em; line-height:1.2; }
  .site-logo .name .accent{ color:var(--primary); }
  .site-logo .tagline{ font-size:11.5px; font-weight:700; color:var(--muted); margin-top:2px; }
  .site-nav{ display:flex; gap:4px; flex-wrap:wrap; }
  .site-nav a{
    text-decoration:none; font-size:12.5px; font-weight:600; color:var(--muted);
    padding:8px 13px; border-radius:6px; transition:.15s;
  }
  .site-nav a:hover{ background:var(--bg); color:var(--ink); }
  .site-nav a.on{ background:var(--primary-light); color:var(--primary-dark); font-weight:700; }

  /* ---- 광고 (회색 처리) ---- */
  .ad-block{
    background:#eceef1; border:1px dashed #cfd3d9; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color:#9aa0a8; font-size:12px; font-weight:700; text-align:center; line-height:1.6;
  }
  .layout{ display:flex; gap:14px; align-items:flex-start; }
  .side-ads{ width:240px; display:flex; flex-direction:column; gap:14px; flex-shrink:0; }
  .side-ads .ad-block{ flex-direction:column; gap:4px; }
  .side-ads .ad-block .sub{ font-size:10.5px; color:#b3b8bf; font-weight:600; }
  .ad-tall{ height:580px; }
  .ad-mid{ height:250px; }

  /* ---- 왼쪽 사이트 메뉴 ---- */
  .side-menu{ width:240px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; }
  .visit-box{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:11.5px; color:var(--muted); font-weight:700;
    display:flex; justify-content:space-between; gap:6px;
  }
  .visit-box b{ color:var(--ink); font-size:12.5px; }
  .menu-card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .menu-card .menu-label{
    font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.02em;
    padding:8px 10px 6px;
  }
  .menu-card a.menu-link{
    display:flex; align-items:center; gap:9px;
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:600;
    padding:10px 10px; border-radius:8px; transition:.15s;
  }
  .menu-card a.menu-link:hover{ background:var(--primary-light); color:var(--primary-dark); }
  .menu-card a.menu-link .ic{ font-size:15px; flex-shrink:0; opacity:.9; }
  .menu-card a.menu-link.active{ background:var(--primary-light); color:var(--primary-dark); font-weight:800; }
  .menu-card .soon-label{
    font-size:10px; font-weight:800; color:#b3b8bf; background:#f1f2f4;
    border-radius:5px; padding:2px 6px; margin-left:auto;
  }
  .menu-card a.menu-link.soon{ color:#b3b8bf; cursor:default; }
  .menu-card a.menu-link.soon:hover{ background:none; }

  /* ---- 핵심 영역 ---- */
  .core{ flex:1; min-width:0; }
  .board-box{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:22px 26px 26px;
  }
  .brand-row{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .brand-name{ font-size:18px; font-weight:800; }
  .brand-sub{ font-size:12px; color:var(--muted); margin-top:3px; font-weight:500; }

  /* ---- 로그인 상태 영역 ---- */
  .auth-area{ display:flex; align-items:center; gap:8px; }
  .btn-login{
    display:flex; align-items:center; gap:7px;
    background:#fff; border:1.5px solid var(--line); border-radius:8px;
    padding:8px 13px; font-size:12.5px; font-weight:700; color:var(--ink);
    cursor:pointer; transition:.15s;
  }
  .btn-login:hover{ border-color:var(--primary); background:var(--primary-light); }
  .user-chip{
    display:flex; align-items:center; gap:7px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px;
    padding:5px 12px 5px 5px; font-size:12.5px; font-weight:700;
  }
  .user-chip .av{
    width:24px; height:24px; border-radius:50%; background:var(--primary);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .user-chip .logout{
    background:none; border:none; color:var(--muted); font-size:11px; font-weight:700;
    cursor:pointer; text-decoration:underline; margin-left:2px;
  }

  /* ---- 툴바 ---- */
  .board-toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px;
  }
  .post-count{ font-size:12.5px; color:var(--muted); font-weight:600; }
  .btn-write{
    background:var(--primary); color:#fff; border:none; border-radius:8px;
    padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.15s;
  }
  .btn-write:hover{ background:var(--primary-dark); }

  /* ---- 게시글 목록 ---- */
  .post-list{ border-top:1.5px solid var(--ink); }
  .post-item{
    border-bottom:1px solid var(--line); padding:14px 6px; cursor:pointer;
  }
  .post-item:hover{ background:var(--bg); }
  .post-row{ display:flex; align-items:center; gap:10px; }
  .badge-cat{
    font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:5px;
    background:var(--primary-light); color:var(--primary-dark); flex-shrink:0;
  }
  .badge-cat.notice{ background:#e8f0ff; color:#3a63c2; }
  .post-title{ font-size:13.5px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-meta{ font-size:11.5px; color:var(--muted); font-weight:600; display:flex; gap:10px; flex-shrink:0; }

  /* ---- 게시글 상세 ---- */
  .post-detail{
    background:var(--bg); border-radius:10px; padding:16px 18px; margin:0 0 10px;
  }
  .post-detail .detail-meta{
    font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .detail-actions{ display:flex; gap:6px; flex-shrink:0; }
  .detail-actions button{
    border:1px solid var(--line); background:#fff; border-radius:6px; padding:3px 10px;
    font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .detail-actions button:hover{ border-color:var(--primary); color:var(--primary-dark); background:var(--primary-light); }
  .detail-actions button.danger:hover{ border-color:#e0554f; color:#e0554f; background:#fdeceb; }

  /* ---- 게시글 본문 (리치 텍스트 / 예전 글 호환) ---- */
  .post-rich{ font-size:13px; line-height:1.8; color:#3a3f47; }
  .post-rich p{ margin:0 0 10px; }
  .post-rich img{ max-width:100%; border-radius:8px; margin:8px 0; display:block; }
  .post-rich a{ color:var(--primary-dark); text-decoration:underline; }
  .post-rich ul, .post-rich ol{ margin:0 0 10px 20px; }
  .post-rich blockquote{ border-left:3px solid var(--line); padding-left:10px; color:var(--muted); margin:0 0 10px; }
  .post-plain{ white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.7; color:#3a3f47; margin-bottom:8px; }
  .post-image{ max-width:100%; border-radius:10px; margin-top:10px; display:block; }

  /* ---- 댓글 ---- */
  .comment-list{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .comment-item{ display:flex; gap:8px; padding:8px 0; font-size:12.5px; }
  .comment-item .c-av{
    width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
  }
  .comment-item .c-body{ flex:1; }
  .comment-item .c-author{ font-weight:800; margin-right:6px; }
  .comment-item .c-date{ color:var(--muted); font-size:10.5px; }
  .comment-item .c-text{ white-space:pre-wrap; word-break:break-word; }
  .comment-item .c-edit, .comment-item .c-del{
    background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:700;
    cursor:pointer; text-decoration:underline; margin-left:6px;
  }
  .comment-item .c-edit:hover{ color:var(--primary-dark); }
  .comment-item .c-del:hover{ color:#e0554f; }
  .c-edit-box{ display:flex; gap:6px; margin-top:6px; }
  .c-edit-box input{
    flex:1; border:1.5px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px;
  }
  .c-edit-box button{
    border:none; border-radius:6px; padding:0 10px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .c-edit-box .save{ background:var(--primary); color:#fff; }
  .c-edit-box .cancel{ background:var(--bg); color:var(--muted); }
  .comment-gate{
    margin-top:10px; padding:12px; background:#fff; border:1px dashed var(--line); border-radius:8px;
    font-size:12px; color:var(--muted); text-align:center;
  }
  .comment-gate .btn-login{ margin:8px auto 0; }
  .comment-write{ display:flex; gap:8px; margin-top:10px; }
  .comment-write input{
    flex:1; border:1.5px solid var(--line); border-radius:8px; padding:8px 12px; font-size:12.5px;
  }
  .comment-write button{
    background:var(--primary); color:#fff; border:none; border-radius:8px; padding:0 14px;
    font-size:12.5px; font-weight:700; cursor:pointer;
  }

  .pagination{ display:flex; justify-content:center; gap:6px; margin-top:18px; }
  .pagination button{
    width:30px; height:30px; border:1.5px solid var(--line); background:#fff; border-radius:7px;
    font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;
  }
  .pagination button.on{ background:var(--primary); border-color:var(--primary); color:#fff; }

  /* ---- 모달 (글쓰기) ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.4);
    display:flex; align-items:center; justify-content:center; z-index:100;
    padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:14px; width:640px; max-width:94vw;
    max-height:90vh; overflow-y:auto;
    padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.2);
  }
  .modal-box h3{ font-size:15px; font-weight:800; margin-bottom:14px; }
  .modal-box select, .modal-box input[type=text]{
    width:100%; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px;
    font-size:13px; margin-bottom:10px; font-family:inherit;
  }
  #wToolbar{
    border:1.5px solid var(--line); border-bottom:none;
    border-top-left-radius:8px; border-top-right-radius:8px;
  }
  #wEditor{
    border:1.5px solid var(--line);
    border-bottom-left-radius:8px; border-bottom-right-radius:8px;
    min-height:220px; margin-bottom:12px; font-size:13px; font-family:inherit;
  }
  .post-image{ max-width:100%; border-radius:10px; margin-top:10px; display:block; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .modal-actions button{
    border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .modal-actions .cancel{ background:var(--bg); color:var(--muted); }
  .modal-actions .submit{ background:var(--primary); color:#fff; }

  .gate-box{
    text-align:center; padding:30px 20px; color:var(--muted); font-size:13px;
  }
  .gate-box .btn-login{ margin:14px auto 0; }

  .site-footer{
    margin-top:14px; text-align:center; padding:16px;
    color:var(--muted); font-size:12px;
  }

  .hidden{ display:none !important; }

  @media (max-width:1300px){ .side-ads{ display:none; } }
  @media (max-width:900px){
    .site-nav{ display:none; }
    .side-menu{ display:none; }
    .post-meta{ display:none; }
  }
</style>

        <span>오늘 <b id="visitToday">-</b></span>

<!-- 글쓰기 모달 -->
<div class="modal-overlay hidden" id="writeModal">
  <div class="modal-box">
    <div id="writeLoggedIn">
      <h3>새 글 쓰기</h3>
      <select id="wCategory">
        <option value="자유">자유</option>
        <option value="질문">질문</option>
        <option value="후기">후기</option>

      <input type="text" id="wTitle" placeholder="제목을 입력하세요">
      <div id="wToolbar">
        <span class="ql-formats">
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
          <button class="ql-strike"></button>
        </span>
        <span class="ql-formats">
          <select class="ql-color"></select>
          <select class="ql-background"></select>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered"></button>
          <button class="ql-list" value="bullet"></button>
          <button class="ql-blockquote"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-link"></button>
          <button class="ql-image"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-clean"></button>
        </span>
      </div>
      <div id="wEditor"></div>
      <div class="modal-actions">
        <button class="cancel" onclick="closeWrite()">취소</button>
        <button class="submit" onclick="submitPost()">등록</button>
      </div>
    </div>
    <div id="writeLoggedOut" class="hidden">

        <div class="btn-login" onclick="googleLogin()">🟢 구글로 로그인하고 글쓰기</div>
      </div>
      <div class="modal-actions">
        <button class="cancel" onclick="closeWrite()">닫기</button>
      </div>
    </div>
  </div>
</div>
