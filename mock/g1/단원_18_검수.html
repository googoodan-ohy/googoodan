<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>\uD604\uC7AC \uB2E8\uC6D0 \uBAA9\uB85D\uC5D0 \uC5C6\uC74C</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

<style>
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#fff;color:#111;margin:0 auto;max-width:210mm;padding:16px;font-size:15px;line-height:1.95}
h1{text-align:center;font-size:20px;margin:6px 0 2px} .sub{text-align:center;color:#555;margin-bottom:10px;border-bottom:2px solid #222;padding-bottom:6px}

/* A4 한 장씩: paginate() 가 문항을 장·단으로 나눈다 */

.page .body{flex:1;display:flex;gap:10mm;min-height:0} .page .col{flex:1;min-width:0;overflow:hidden} .page .col+.col{border-left:1px solid #bbb;padding-left:10mm}

<h1>\uD604\uC7AC \uB2E8\uC6D0 \uBAA9\uB85D\uC5D0 \uC5C6\uC74C</h1><div id="top"> <small>원본은 내부 확인용 — 밖으로 내보내지 마세요.</small></div><script>
let S={};try{S=JSON.parse(localStorage.getItem('itemrev')||'{}')}catch(e){}
function st(){try{localStorage.setItem('itemrev',JSON.stringify(S))}catch(e){}}
function paint(){let o=0,b=0,n=0;document.querySelectorAll('.card').forEach(c=>{const k=c.dataset.k,s=S[k]||{};n++;
c.classList.toggle('ok',s.m=='ok');c.classList.toggle('bad',s.m=='bad');if(s.m=='ok')o++;if(s.m=='bad')b++;
const i=c.querySelector('textarea');if(i&&document.activeElement!==i)i.value=s.t||''});
(document.getElementById('cnt')||{}).textContent=`합격 ${o} · 불합격 ${b} · 남음 ${n-o-b} / ${n}`}
function rm(el){if(!el||el.dataset.m)return;el.dataset.m=1;renderMathInElement(el,window.KO)}function lazyMath(o){window.KO=o;const io=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;const c=e.target;io.unobserve(c);c.querySelectorAll('.box.org,.oa,.os').forEach(rm);const a=[...c.querySelectorAll('.alt')].find(x=>x.style.display!='none');rm(a||c)}},{rootMargin:'800px 0px'});document.querySelectorAll('.card').forEach(c=>io.observe(c));document.querySelectorAll('body>*:not(.card)').forEach(rm)}
function nx(b){const A=[...b.closest('.card').querySelectorAll('.alt')];if(A.length<2)return;const i=A.findIndex(a=>a.style.display!='none');A[i].style.display='none';A[(i+1)%A.length].style.display='';rm(A[(i+1)%A.length])}
const PK='pick_sheet_v1';let PICKS=[];try{PICKS=JSON.parse(localStorage.getItem(PK)||'[]');if(!Array.isArray(PICKS))PICKS=[]}catch(e){PICKS=[]}
function savePicks(){try{localStorage.setItem(PK,JSON.stringify(PICKS))}catch(e){};window.parent.postMessage({type:'pick-sheet-change',count:PICKS.length},'*');paintPicks()}
function readPick(b){try{return JSON.parse(decodeURIComponent(escape(atob(b.dataset.pick))))}catch(e){return null}}
function togglePick(b){const p=readPick(b);if(!p)return;const i=PICKS.findIndex(x=>x.id===p.id);if(i>=0)PICKS.splice(i,1);else PICKS.push(p);savePicks()}
function pickOriginal(b){togglePick(b)}
function pickAlt(b){const c=b.closest('.card'),i=Number(b.dataset.i),alts=[...c.querySelectorAll('.alt')];alts.forEach((a,j)=>a.style.display=j===i?'':'none');rm(alts[i]);togglePick(b)}
function paintPicks(){const ix=new Map(PICKS.map((p,i)=>[p.id,i+1]));document.querySelectorAll('.pickbar button').forEach(b=>{const p=readPick(b),n=p&&ix.get(p.id);b.classList.toggle('on',!!n);b.textContent=n?'선택 '+n:b.dataset.label})}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='pick-sheet-clear'){PICKS=[];paintPicks()}else if(e.data&&e.data.type==='pick-sheet-change'){try{PICKS=JSON.parse(localStorage.getItem(PK)||'[]')}catch(x){PICKS=[]}paintPicks()}})
function mk(k,m){S[k]=Object.assign(S[k]||{},{m});st();paint()}
function why(k,v){S[k]=Object.assign(S[k]||{},{t:v});if(v&&!S[k].m)S[k].m='bad';st();paint()}
document.addEventListener('DOMContentLoaded',()=>{paint();paintPicks();lazyMath({delimiters:[{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:false}],throwOnError:false,preProcess:m=>'\\displaystyle '+m})});
